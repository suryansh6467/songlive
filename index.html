<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suryansh's Music Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    
    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Glassmorphism Capsule Container */
    .glass-capsule {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* Custom Range Sliders */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 5px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
    }

    input[type=range]::-webkit-slider-thumb {
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -4.5px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      transition: transform 0.1s ease;
    }

    /* Vinyl Rotating Animation */
    .spinning {
      animation: spin 12s linear infinite;
    }

    .paused-spin {
      animation-play-state: paused;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Metallic Rounded Buttons */
    .btn-glass {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.3), 0 4px 10px rgba(0, 0, 0, 0.25);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-glass:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.3);
    }

    /* Custom Scrollbar for Playlist Drawer */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* Red Glowing Neon Effect */
    .red-glow {
      color: #ff3b3b;
      text-shadow: 0 0 10px rgba(255, 59, 59, 0.8), 
                   0 0 20px rgba(255, 59, 59, 0.6), 
                   0 0 30px rgba(255, 59, 59, 0.4);
    }
  </style>
</head>
<body class="relative flex flex-col justify-between items-center text-white p-4 sm:p-8 bg-black">

  <!-- Responsive Background Image Layer -->
  <div class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none z-0">
    <img src="https://raw.githubusercontent.com/suryansh6467/songs/main/172404-your_name-mitsuha_miyamizu-taki_tachibana-anime-atmosphere-7680x4320.jpg" 
         class="w-full h-full object-cover filter brightness-[0.55]"

  </div>

    <div id="digital-clock" class="text-2xl sm:text-4xl font-bold tracking-wider drop-shadow-md text-white/95">
      <span id="hours-part" class="red-glow">00</span>:00:00

      <i class="fa-solid fa-bars text-lg"></i>
      <span class="hidden sm:inline">Playlist</span>
    </button>
  </header>

  <main class="flex flex-col items-center justify-center flex-grow z-10 my-auto text-center w-full max-w-4xl px-2">
    <!-- Main Player Capsule Container -->
    <div class="w-full glass-capsule rounded-3xl sm:rounded-full p-4 sm:p-5 flex flex-col md:flex-row items-center gap-4 sm:gap-6 relative">
      
      <!-- Album Art (Left Side Circular Container) -->
      <div class="relative flex-shrink-0">
        <div class="w-20 h-20 sm:w-28 sm:h-28 rounded-full overflow-hidden border-2 border-white/40 shadow-2xl relative flex items-center justify-center">
          <img id="album-cover" 
               src="https://raw.githubusercontent.com/suryansh6467/songs/main/1313eb05e394d398870fc6a320eec62e.jpg" 
               alt="CD Cover" 
               class="w-full h-full object-cover spinning paused-spin"
               onerror="this.src='https://placehold.co/120x120/333/fff?text=Music'">
        </div>
      </div>

      <!-- Center Song Info & Controls -->
      <div class="flex-grow w-full flex flex-col justify-center gap-2 px-2">
        <!-- Title & Subtitle -->
        <div class="text-left">
          <h2 id="song-title" class="text-lg sm:text-2xl font-bold text-white tracking-wide truncate">
            Song Title
          </h2>
          <p id="artist-name" class="text-xs sm:text-sm text-white/70 font-medium">
            Artist Name
          </p>
        </div>

        <!-- Progress Bar & Time Stamps -->
        <div class="flex items-center gap-3">
          <span id="current-time" class="text-xs text-white/80 font-mono w-8 text-right">0:00</span>
          
          <div class="relative flex-grow flex items-center py-1">
            <input type="range" id="seek-bar" value="0" min="0" max="100" class="z-10">
          </div>
          
          <span id="total-duration" class="text-xs text-white/80 font-mono w-8 text-left">0:00</span>
        </div>
      </div>

      <!-- Right Media Control Buttons -->
      <div class="flex items-center gap-2 sm:gap-3 px-2">
        <!-- Previous Button -->
        <button id="prev-btn" title="Previous Song" class="btn-glass w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center text-white/90">
          <i class="fa-solid fa-chevron-left text-sm sm:text-base"></i>
        </button>

        <!-- Play / Pause Main Button -->
        <button id="play-btn" title="Play / Pause" class="btn-glass w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-white shadow-xl">
          <i id="play-icon" class="fa-solid fa-play text-base sm:text-xl ml-0.5"></i>
        </button>

        <!-- Next Button -->
        <button id="next-btn" title="Next Song" class="btn-glass w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center text-white/90">
          <i class="fa-solid fa-chevron-right text-sm sm:text-base"></i>
        </button>
      </div>

    </div>

    <!-- Name Badge Positioned Just Below the Music Player Capsule -->
    <div class="mt-4 flex justify-center">
      <span class="border border-white/60 px-4 py-1 rounded-full bg-black/40 backdrop-blur-md text-xs sm:text-sm font-semibold tracking-widest text-white shadow-lg">
        N0tSuryansh
      </span>
    </div>
  </main>

  <!-- Slide-out Playlist Drawer Backdrop -->
  <div id="drawer-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <!-- Slide-out Playlist Drawer Container -->
  <aside id="playlist-drawer" class="fixed top-0 right-0 h-full w-full max-w-sm glass-capsule z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col p-6 rounded-l-3xl">
    <!-- Drawer Header -->
    <div class="flex items-center justify-between pb-4 border-b border-white/20">
      <div class="flex items-center gap-2">

      </div>
      <button id="close-drawer-btn" title="Close Menu" class="btn-glass w-9 h-9 rounded-full flex items-center justify-center text-white/80">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Scrollable Songs List -->
    <div id="playlist-items" class="flex-grow overflow-y-auto my-4 space-y-2 pr-1 custom-scrollbar">
      <!-- Dynamic list items will be injected by JavaScript -->
    </div>
  </aside>

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      // Update with glowing red hours
      digitalClock.innerHTML = `<span id="hours-part" class="red-glow">${hours}</span>:${minutes}:${seconds}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

            ? 'bg-white/20 border border-white/40 shadow-md' 
            : 'hover:bg-white/10 border border-transparent'
        }`;

        item.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-xs flex-shrink-0">
              ${isCurrent ? '<i class="fa-solid fa-compact-disc text-amber-300 spinning"></i>' : (idx + 1)}
            </div>
            <div class="truncate">
              <h4 class="text-sm font-semibold truncate ${isCurrent ? 'text-amber-300' : 'text-white'}">${song.title}</h4>
              <p class="text-xs text-white/60 truncate">${song.artist || 'Unknown Artist'}</p>
            </div>
          </div>
          <span class="text-xs text-white/50 font-mono ml-2">${song.duration}</span>
        `;

        item.addEventListener('click', () => {
          currentSongIndex = idx;
          loadSong(playlist[currentSongIndex]);
          playSong();
        });

        playlistItemsContainer.appendChild(item);
      });
    }

    function openDrawer() {
      playlistDrawer.classList.remove('translate-x-full');
      drawerBackdrop.classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeDrawer() {
      playlistDrawer.classList.add('translate-x-full');
      drawerBackdrop.classList.add('opacity-0', 'pointer-events-none');
    }

    menuToggleBtn.addEventListener('click', openDrawer);
    closeDrawerBtn.addEventListener('click', closeDrawer);
    drawerBackdrop.addEventListener('click', closeDrawer);

    function loadSong(song) {
      songTitle.textContent = song.title;
      artistName.textContent = song.artist || "Unknown Artist";
      albumCover.src = defaultCover;
      audioElement.src = song.src;
      totalDurationEl.textContent = song.duration;
      seekBar.value = 0;
      currentTimeEl.textContent = "0:00";
      renderPlaylist();
    }

    function togglePlay() {
      if (isPlaying) {
        pauseSong();
      } else {
        playSong();
      }
    }

    function playSong() {
      isPlaying = true;
      audioElement.play().catch(e => console.log("Audio play allowed after user click"));
      playIcon.classList.remove('fa-play');
      playIcon.classList.add('fa-pause');
      albumCover.classList.remove('paused-spin');
    }

    function pauseSong() {
      isPlaying = false;
      audioElement.pause();
      playIcon.classList.remove('fa-pause');
      playIcon.classList.add('fa-play');
      albumCover.classList.add('paused-spin');
    }

    function prevSong() {
      currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
      loadSong(playlist[currentSongIndex]);
      if (isPlaying) playSong();
    }

    function nextSong() {
      currentSongIndex = (currentSongIndex + 1) % playlist.length;
      loadSong(playlist[currentSongIndex]);
      if (isPlaying) playSong();
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevSong);
    nextBtn.addEventListener('click', nextSong);

    audioElement.addEventListener('timeupdate', () => {
      if (audioElement.duration) {
        const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
        seekBar.value = progressPercent;
        currentTimeEl.textContent = formatTime(audioElement.currentTime);
      }
    });

    seekBar.addEventListener('input', () => {
      if (audioElement.duration) {
        const seekTime = (seekBar.value / 100) * audioElement.duration;
        audioElement.currentTime = seekTime;
      }
    });

    audioElement.addEventListener('ended', nextSong);
    audioElement.addEventListener('error', nextSong);

    loadSong(playlist[currentSongIndex]);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N0tSuryansh Music Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* =========================
   RESET & VARIABLES
========================= */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  font-family: "Plus Jakarta Sans", sans-serif;
  background: #000;
  color: #fff;
  overflow: hidden;
  user-select: none;
}

/* =========================
   BACKGROUND
========================= */
.background {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: #000;
}

.background::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.15); /* Yahan dark layer ko bahut halka kar diya hai taaki image bright rahe */
  pointer-events: none;
}

.bg-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.95) saturate(1.15); /* Yahan image ki brightness badha di hai */
  opacity: 0;
  transition: opacity 1.6s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: opacity;
}

.bg-image.active {
  opacity: 1;
}

/* =========================
   APP CONTAINER
========================= */
.app {
  position: relative;
  z-index: 5;
  width: 100%;
  height: 100dvh;
  min-height: 100dvh;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* =========================
   HEADER
========================= */
.header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.clock {
  font-size: clamp(20px, 3.5vw, 32px);
  font-weight: 800;
  letter-spacing: 2px;
  color: rgba(255,255,255,.95);
  text-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

/* =========================
   GLASS EFFECT
========================= */
.glass {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow:
    0 25px 50px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

/* =========================
   BUTTONS
========================= */
.glass-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,0.22);
  color: #fff;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.25),
    0 8px 20px rgba(0,0,0,0.3);
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.glass-btn:hover {
  background: rgba(255,255,255,0.22);
  border-color: rgba(255,255,255,0.4);
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.glass-btn:active {
  transform: scale(0.93) translateY(0);
}

.menu-button {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  font-size: 16px;
}

/* =========================
   MAIN LAYOUT
========================= */
.main {
  width: 100%;
  max-width: 950px;
  margin: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* =========================
   PLAYER CARD
========================= */
.player {
  width: 100%;
  padding: 18px 24px;
  border-radius: 36px;
  display: flex;
  align-items: center;
  gap: 24px;
}

/* =========================
   VINYL COVER ART
========================= */
.cover-wrapper {
  flex-shrink: 0;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid rgba(255,255,255,0.4);
  box-shadow:
    0 15px 35px rgba(0,0,0,0.5),
    0 0 25px rgba(255,255,255,0.12);
  position: relative;
}

.cover {
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: spin 14s linear infinite;
  animation-play-state: paused;
  will-change: transform;
}

.cover.playing {
  animation-play-state: running;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* =========================
   SONG INFO AREA
========================= */
.song-area {
  flex: 1;
  min-width: 0;
}

.song-title {
  margin: 0;
  font-size: clamp(18px, 2.2vw, 24px);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: .4px;
}

.artist {
  margin: 4px 0 0;
  font-size: 13px;
  color: rgba(255,255,255,0.65);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* =========================
   PROGRESS BAR
========================= */
.progress-row {
  width: 100%;
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.time {
  width: 38px;
  font-size: 11px;
  font-family: monospace;
  color: rgba(255,255,255,0.7);
}

.time.right { text-align: left; }
.time.left { text-align: right; }

.seek {
  flex: 1;
  width: 100%;
  appearance: none;
  -webkit-appearance: none;
  height: 6px;
  border-radius: 10px;
  background: rgba(255,255,255,0.2);
  outline: none;
  cursor: pointer;
  transition: height 0.15s ease;
}

.seek:hover {
  height: 8px;
}

.seek::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 15px rgba(255,255,255,0.8);
  cursor: pointer;
  transition: transform 0.15s ease;
}

.seek::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}

/* =========================
   CONTROLS
========================= */
.controls-container {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 16px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 14px;
}

.control {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  font-size: 15px;
}

.play-button {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  font-size: 20px;
  background: rgba(255,255,255,0.22);
}

.play-icon {
  margin-left: 2px;
}

/* =========================
   BADGE
========================= */
.badge {
  margin-top: 18px;
  padding: 6px 18px;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 999px;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(12px);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* =========================
   MODAL / MENU
========================= */
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  padding: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  opacity: 1;
  visibility: visible;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.modal.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.modal-box {
  width: 100%;
  max-width: 480px;
  max-height: 88dvh;
  padding: 22px;
  border-radius: 30px;
  display: flex;
  flex-direction: column;
  transform: translateY(0) scale(1);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal.hidden .modal-box {
  transform: translateY(20px) scale(0.95);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 14px;
  margin-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}

.modal-title { margin: 0; font-size: 20px; font-weight: 700; }
.modal-subtitle { margin: 3px 0 0; font-size: 11px; color: rgba(255,255,255,0.55); }

.close-button {
  width: 38px;
  height: 38px;
  border-radius: 50%;
}

.menu-content {
  overflow-y: auto;
  padding-right: 4px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.3) transparent;
}

.menu-content::-webkit-scrollbar { width: 5px; }
.menu-content::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.3);
  border-radius: 20px;
}

/* =========================
   OPTIONS & TOGGLES
========================= */
.option {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 8px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  transition: all 0.2s ease;
}

.option:hover {
  background: rgba(255,255,255,0.12);
}

.option-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.option-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.15);
  font-size: 13px;
}

.option-title { margin: 0; font-size: 13px; font-weight: 700; }
.option-status { margin: 2px 0 0; font-size: 11px; color: rgba(255,255,255,0.55); }

/* Background Selector */
.section-title {
  margin: 16px 0 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}

.background-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.bg-thumb {
  height: 62px;
  overflow: hidden;
  border-radius: 12px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.2s ease;
}

.bg-thumb:hover { transform: scale(1.03); }
.bg-thumb.active { border-color: rgba(255,255,255,0.9); box-shadow: 0 0 12px rgba(255,255,255,0.4); }
.bg-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* =========================
   PLAYLIST ITEMS
========================= */
.playlist-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
}

.song-count { font-size: 10px; color: rgba(255,255,255,0.55); }

.songs-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 6px;
}

.song-item {
  padding: 10px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
  cursor: pointer;
  transition: all 0.2s ease;
}

.song-item:hover { background: rgba(255,255,255,0.12); }
.song-item.current {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.4);
}

.song-left {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.song-number {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.1);
  font-size: 11px;
  font-weight: 700;
}

.song-text { min-width: 0; }
.song-name {
  margin: 0;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.song-artist {
  margin: 2px 0 0;
  font-size: 10px;
  color: rgba(255,255,255,0.58);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.song-duration {
  flex-shrink: 0;
  margin-left: 8px;
  font-family: monospace;
  font-size: 10px;
  color: rgba(255,255,255,0.55);
}

/* =========================
   RESPONSIVE DESIGN
========================= */
@media (max-width: 768px) {
  .app { padding: 14px; }
  .player {
    border-radius: 28px;
    padding: 14px;
    gap: 14px;
    flex-wrap: wrap;
  }
  .cover-wrapper { width: 84px; height: 84px; }
  .song-area { flex: 1; min-width: calc(100% - 110px); }
  .controls-container {
    width: 100%;
    justify-content: center;
    margin-top: 12px;
  }
}

@media (max-width: 380px) {
  .cover-wrapper { width: 70px; height: 70px; }
  .song-title { font-size: 15px; }
  .controls { gap: 8px; }
  .control { width: 40px; height: 40px; }
  .play-button { width: 50px; height: 50px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
  }
}
</style>
</head>

        </div>
      </div>
    </div>

    <div class="badge">N0tSuryansh</div>
  </main>
</div>

<!-- PLAYLIST & SETTINGS MODAL -->
<div id="playlist-modal" class="modal hidden">
  <div class="modal-box glass">
    <div class="modal-header">
      <div>
        <h3 class="modal-title">Music Menu</h3>
        <p class="modal-subtitle">Player Settings</p>
      </div>
      <button id="close-menu" class="glass-btn close-button" aria-label="Close Menu">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="menu-content">
      <!-- SHUFFLE -->
      <div id="shuffle-toggle" class="option">
        <div class="option-left">
          <div class="option-icon"><i class="fa-solid fa-shuffle"></i></div>
          <div>
            <h4 class="option-title">Shuffle</h4>
            <p id="shuffle-status" class="option-status">Off</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </div>

      <!-- REPEAT -->
      <div id="repeat-toggle" class="option">
        <div class="option-left">
          <div class="option-icon"><i class="fa-solid fa-repeat"></i></div>
          <div>
            <h4 class="option-title">Repeat</h4>
            <p id="repeat-status" class="option-status">All songs</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </div>

      <!-- BACKGROUNDS -->
      <div class="section-title">Background Theme</div>
      <div id="background-grid" class="background-grid">
        <div class="bg-thumb active" data-index="0">
          <img src="https://raw.githubusercontent.com/suryansh6467/songs/main/172404-your_name-mitsuha_miyamizu-taki_tachibana-anime-atmosphere-7680x4320.jpg" alt="Bg 1">
        </div>
        <div class="bg-thumb" data-index="1">
          <img src="https://raw.githubusercontent.com/suryansh6467/songs/main/anime-girl-meteor-streak-10k-0t.jpg" alt="Bg 2">
        </div>
        <div class="bg-thumb" data-index="2">
          <img src="https://raw.githubusercontent.com/suryansh6467/songs/main/horizon-clouds-sea-sunset-calm-8k-3q.jpg" alt="Bg 3">
        </div>
      </div>

      <!-- PLAYLIST HEADER -->
      <div class="playlist-heading">
        <div class="section-title">Playlist</div>
        <span id="playlist-count" class="song-count">0 Songs</span>
      </div>

      <!-- SONGS LIST -->
      <div id="songs-list" class="songs-list"></div>
    </div>
  </div>
</div>

<audio id="audio-element" preload="metadata"></audio>

  { title: "Tune Jo Na Kaha", artist: "Mohit Chauhan", duration: "2:23", src: "https://raw.githubusercontent.com/suryansh6467/songs/main/vidssave.com%20Tune%20Jo%20Na%20Kaha%20Song%20_%20New%20York%20_%20John%20Abraham%2C%20Katrina%20Kaif%2C%20Neil%20Nitin%20M%20_%20Mohit%20Chauhan%20_%20Pritam%20128kbps.mp4" },

  { title: "Humsafar", artist: "Varun & Alia Bhatt", duration: "3:34", src: "https://raw.githubusercontent.com/suryansh6467/songs/main/Humsafar-Full-Video-SnapYT.App.mp3" },
  { title: "Tu Jaane Na", artist: "Atif Aslam", duration: "5:37", src: "https://raw.githubusercontent.com/suryansh6467/songs/main/vidssave.com%20Tu%20Jaane%20Na%20-%20Atif%20Aslam%20(Lyrics)%20_%20Lyrical%20Bam%20Hindi%20128kbps.mp4" },
  { title: "Ishqa Ve", artist: "Zeeshan Ali", duration: "3:37", src: "https://raw.githubusercontent.com/suryansh6467/songs/main/vidssave.com%20ishqa%20ve%20chhaddeya%20tu%20kakh%20da%20nai%20saanu%20(Lyrics)%20Ishqa%20Ve%20%20-%20Zeeshan%20Ali%20128KBPS.mp4" },
  { title: "Tum Se Hi", artist: "Mohit Chauhan", duration: "5:23", src: "https://raw.githubusercontent.com/suryansh6467/songs/main/Mohit-Chauhan-SnapYT.App.mp3" },
  { title: "Virhaa", artist: "Mizajii, Sammohitt", duration: "3:00", src: "https://raw.githubusercontent.com/suryansh6467/songs/main/mizajii-sammohit--prod-by-dikshyant.mp3" },
  { title: "Ae Dil Hai Mushkil", artist: "Arijit Singh", duration: "5:00", src: "https://raw.githubusercontent.com/suryansh6467/songs/main/vidssave.com%20Ae%20Dil%20Hai%20Mushkil%20Title%20Track%20Full%20Video%20-%20Ranbir%2C%20Anushka%2C%20Aishwarya%20_%20Arijit%20Singh_%20Pritam%2048KBPS.mp4" },
  { title: "Faasle", artist: "Aditya Rikhari", duration: "3:36", src: "https://raw.githubusercontent.com/suryansh6467/songs/main/YTDown.com_YouTube_Media_EiiOYwqk3A0_Aditya-Rikhari-FAASLE_009_128k.mp3" }
];

let currentSongIndex = Math.floor(Math.random() * playlist.length);
let isPlaying = false;
let isShuffle = false;
let repeatMode = 0;
let currentBgIndex = 0;
let activeLayer = 1;

const audio = document.getElementById("audio-element");
const playBtn = document.getElementById("play-btn");
const playIcon = document.getElementById("play-icon");
const prevBtn = document.getElementById("prev-btn");
const nextBtn = document.getElementById("next-btn");
const titleEl = document.getElementById("song-title");
const artistEl = document.getElementById("artist-name");
const coverEl = document.getElementById("album-cover");
const seekBar = document.getElementById("seek-bar");
const currentTimeEl = document.getElementById("current-time");
const totalDurationEl = document.getElementById("total-duration");
const clockEl = document.getElementById("digital-clock");
const modal = document.getElementById("playlist-modal");
const menuBtn = document.getElementById("menu-btn");
const closeMenu = document.getElementById("close-menu");
const songsList = document.getElementById("songs-list");
const playlistCount = document.getElementById("playlist-count");
const shuffleToggle = document.getElementById("shuffle-toggle");
const shuffleStatus = document.getElementById("shuffle-status");
const repeatToggle = document.getElementById("repeat-toggle");
const repeatStatus = document.getElementById("repeat-status");
const bg1 = document.getElementById("bg1");
const bg2 = document.getElementById("bg2");

const backgrounds = [
  "https://raw.githubusercontent.com/suryansh6467/songs/main/172404-your_name-mitsuha_miyamizu-taki_tachibana-anime-atmosphere-7680x4320.jpg",
  "https://raw.githubusercontent.com/suryansh6467/songs/main/anime-girl-meteor-streak-10k-0t.jpg",
  "https://raw.githubusercontent.com/suryansh6467/songs/main/horizon-clouds-sea-sunset-calm-8k-3q.jpg"
];

/* Clock */
function updateClock() {
  const now = new Date();
  clockEl.textContent = now.toLocaleTimeString("en-GB", { hour12: false });
}
updateClock();
setInterval(updateClock, 1000);

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${minutes}:${secs.toString().padStart(2, "0")}`;
}

function loadSong(song) {
  titleEl.textContent = song.title;
  artistEl.textContent = song.artist || "Unknown Artist";
  coverEl.src = defaultCover;
  audio.src = song.src;
  audio.load();
  seekBar.value = 0;
  currentTimeEl.textContent = "0:00";
  totalDurationEl.textContent = song.duration || "0:00";
}

async function playSong() {
  try {
    await audio.play();
    isPlaying = true;
    playIcon.className = "fa-solid fa-pause play-icon";
    coverEl.classList.add("playing");
  } catch (error) {
    console.log("Autoplay prevented:", error);
    isPlaying = false;
  }
}

function pauseSong() {
  audio.pause();
  isPlaying = false;
  playIcon.className = "fa-solid fa-play play-icon";
  coverEl.classList.remove("playing");
}

function togglePlay() {
  if (isPlaying) pauseSong();
  else playSong();
}

function nextSong() {
  if (repeatMode === 1) {
    audio.currentTime = 0;
    playSong();
    return;
  }
  if (isShuffle) {
    let nextIndex;
    do {
      nextIndex = Math.floor(Math.random() * playlist.length);
    } while (playlist.length > 1 && nextIndex === currentSongIndex);
    currentSongIndex = nextIndex;
  } else {
    currentSongIndex = (currentSongIndex + 1) % playlist.length;
  }
  const shouldPlay = isPlaying;
  loadSong(playlist[currentSongIndex]);
  if (shouldPlay) playSong();
  if (!modal.classList.contains("hidden")) renderPlaylist();
}

function previousSong() {
  currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
  const shouldPlay = isPlaying;
  loadSong(playlist[currentSongIndex]);
  if (shouldPlay) playSong();
  if (!modal.classList.contains("hidden")) renderPlaylist();
}

/* Audio Events */
audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;
  seekBar.value = (audio.currentTime / audio.duration) * 100;
  currentTimeEl.textContent = formatTime(audio.currentTime);
});

audio.addEventListener("loadedmetadata", () => {
  if (Number.isFinite(audio.duration)) {
    totalDurationEl.textContent = formatTime(audio.duration);
  }
});

audio.addEventListener("ended", nextSong);

seekBar.addEventListener("input", () => {
  if (!audio.duration) return;
  audio.currentTime = (seekBar.value / 100) * audio.duration;
});

/* Playlist Rendering */
function renderPlaylist() {
  songsList.innerHTML = "";
  
  playlist.forEach((song, index) => {
    const item = document.createElement("div");
    const isCurrent = index === currentSongIndex;
    item.className = "song-item" + (isCurrent ? " current" : "");
    item.innerHTML = `
      <div class="song-left">
        <div class="song-number">
          ${isCurrent ? '<i class="fa-solid fa-volume-high"></i>' : index + 1}
        </div>
        <div class="song-text">
          <p class="song-name">${escapeHTML(song.title)}</p>
          <p class="song-artist">${escapeHTML(song.artist || "Unknown Artist")}</p>
        </div>
      </div>
      <span class="song-duration">${escapeHTML(song.duration || "0:00")}</span>
    `;

    item.addEventListener("click", () => {
      currentSongIndex = index;
      loadSong(playlist[currentSongIndex]);
      playSong();
      closeModalWindow();
    });

    songsList.appendChild(item);
  });
  playlistCount.textContent = `${playlist.length} Songs`;
}

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* Modal Handling */
function openModal() {
  modal.classList.remove("hidden");
  renderPlaylist();
}
function closeModalWindow() {
  modal.classList.add("hidden");
}

menuBtn.addEventListener("click", openModal);
closeMenu.addEventListener("click", closeModalWindow);
modal.addEventListener("click", (e) => { if (e.target === modal) closeModalWindow(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModalWindow(); });

/* Shuffle & Repeat */
shuffleToggle.addEventListener("click", () => {
  isShuffle = !isShuffle;
  shuffleStatus.textContent = isShuffle ? "On" : "Off";
});

repeatToggle.addEventListener("click", () => {
  repeatMode = repeatMode === 0 ? 1 : 0;
  repeatStatus.textContent = repeatMode === 1 ? "Single loop" : "All songs";
});

/* Background Customizer */
function changeBackground(index) {
  if (index < 0 || index >= backgrounds.length) return;
  currentBgIndex = index;
  const img = new Image();
  img.onload = () => {
    if (activeLayer === 1) {
      bg2.src = backgrounds[index];
      bg2.classList.add("active");
      bg1.classList.remove("active");
      activeLayer = 2;
    } else {
      bg1.src = backgrounds[index];
      bg1.classList.add("active");
      bg2.classList.remove("active");
      activeLayer = 1;
    }
    document.querySelectorAll(".bg-thumb").forEach((thumb, i) => {
      thumb.classList.toggle("active", i === index);
    });
  };
  img.src = backgrounds[index];
}

document.querySelectorAll(".bg-thumb").forEach(thumb => {
  thumb.addEventListener("click", () => {
    changeBackground(Number(thumb.dataset.index));
  });
});

setInterval(() => {
  changeBackground((currentBgIndex + 1) % backgrounds.length);
}, 35000);

/* Controls Event Listeners */
playBtn.addEventListener("click", togglePlay);
prevBtn.addEventListener("click", previousSong);
nextBtn.addEventListener("click", nextSong);

/* Initial Load */
loadSong(playlist[currentSongIndex]);
</script>

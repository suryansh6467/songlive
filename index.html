  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       GLASS PLAYER
    ========================== */

    .glass-capsule {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* =========================
       RANGE SLIDER
    ========================== */

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 5px;
      cursor: pointer;
      background: rgba(255,255,255,0.3);
      border-radius: 3px;
    }

    input[type=range]::-webkit-slider-thumb {
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -4.5px;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    /* =========================
       VINYL
    ========================== */

    .spinning {
      animation: spin 12s linear infinite;
    }

    .paused-spin {
      animation-play-state: paused;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* =========================
       BUTTONS
    ========================== */

    .btn-glass {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.3),
        0 4px 10px rgba(0,0,0,0.25);
      transition: all 0.2s ease;
    }

    .btn-glass:active {
      transform: scale(0.95);
      background: rgba(255,255,255,0.3);
    }

    /* =========================
       MENU
    ========================== */

    .menu-panel {
      position: fixed;
      top: 75px;
      right: 20px;
      width: 330px;
      max-width: calc(100vw - 30px);
      max-height: calc(100vh - 100px);

      background: rgba(20,20,25,0.65);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);

      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 24px;

      box-shadow:
        0 25px 60px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.15);

      overflow: hidden;

      opacity: 0;
      transform: translateY(-15px) scale(0.96);
      pointer-events: none;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .menu-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .menu-header {
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      color: rgba(255,255,255,0.9);
      border-radius: 14px;
      transition: all 0.2s ease;
      text-align: left;
    }

    .menu-item:hover {
      background: rgba(255,255,255,0.12);
      transform: translateX(3px);
    }

    .menu-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .playlist-container {
      max-height: 300px;
      overflow-y: auto;
      padding: 10px;
    }

    .playlist-container::-webkit-scrollbar {
      width: 5px;
    }

    .playlist-container::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.25);
      border-radius: 10px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .song-item:hover {
      background: rgba(255,255,255,0.12);
    }

    .song-item.active {
      background: rgba(255,255,255,0.18);
    }

    .song-number {
      width: 25px;
      text-align: center;
      color: rgba(255,255,255,0.55);
      font-size: 12px;
    }

    .song-info {
      min-width: 0;
      flex: 1;
    }

    .song-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      margin-top: 2px;
    }

    /* =========================
       BACKGROUND SELECTOR
    ========================== */

    .background-options {
      display: flex;
      gap: 8px;
      padding: 0 16px 15px;
    }

    .bg-option {
      flex: 1;
      height: 45px;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.2s;
    }

    .bg-option.active {
      border-color: white;
    }

    .bg-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================
       OVERLAY
    ========================== */

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: none;
    }

    .menu-overlay.show {
      display: block;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {
      .menu-panel {
        top: 68px;
        right: 12px;
        width: calc(100vw - 24px);
      }

      .playlist-container {
        max-height: 250px;
      }
    }
  </style>

    ========================================== */

    const audioElement =
      document.getElementById("audio-element");

    const playBtn =
      document.getElementById("play-btn");

    const playIcon =
      document.getElementById("play-icon");

    const prevBtn =
      document.getElementById("prev-btn");

    const nextBtn =
      document.getElementById("next-btn");

    const songTitle =
      document.getElementById("song-title");

    const artistName =
      document.getElementById("artist-name");

    const albumCover =
      document.getElementById("album-cover");

    const seekBar =
      document.getElementById("seek-bar");

    const currentTimeEl =
      document.getElementById("current-time");

    const totalDurationEl =
      document.getElementById("total-duration");

    const digitalClock =
      document.getElementById("digital-clock");


    /* ==========================================
       MENU ELEMENTS
    ========================================== */

    const menuBtn =
      document.getElementById("menu-btn");

    const menuPanel =
      document.getElementById("menu-panel");

    const menuOverlay =
      document.getElementById("menu-overlay");

    const menuIcon =
      document.getElementById("menu-icon");

    const closeMenu =
      document.getElementById("close-menu");

    const playlistContainer =
      document.getElementById("playlist-container");

    const songCount =
      document.getElementById("song-count");

    const shuffleBtn =
      document.getElementById("shuffle-btn");

    const shuffleStatus =
      document.getElementById("shuffle-status");

    const repeatBtn =
      document.getElementById("repeat-btn");

    const repeatStatus =
      document.getElementById("repeat-status");

    const backgroundImage =
      document.getElementById("background-image");


    /* ==========================================
       CLOCK
    ========================================== */

    function updateClock() {

      const now = new Date();

      const hours =
        String(now.getHours()).padStart(2, "0");

      const minutes =
        String(now.getMinutes()).padStart(2, "0");

      const seconds =
        String(now.getSeconds()).padStart(2, "0");

      digitalClock.textContent =
        `${hours}:${minutes}:${seconds}`;
    }

    setInterval(updateClock, 1000);

    updateClock();


    /* ==========================================
       MENU OPEN / CLOSE
    ========================================== */

    function openMenu() {

      menuPanel.classList.add("open");

      menuOverlay.classList.add("show");

      menuIcon.classList.remove("fa-bars");

      menuIcon.classList.add("fa-xmark");

    }


    function closeMenuPanel() {

      menuPanel.classList.remove("open");

      menuOverlay.classList.remove("show");

      menuIcon.classList.remove("fa-xmark");

      menuIcon.classList.add("fa-bars");

    }


    menuBtn.addEventListener("click", () => {

      if (menuPanel.classList.contains("open")) {

        closeMenuPanel();

      } else {

        openMenu();

      }

    });


    closeMenu.addEventListener(
      "click",
      closeMenuPanel
    );


    menuOverlay.addEventListener(
      "click",
      closeMenuPanel
    );


    /* ==========================================
       LOAD SONG
    ========================================== */

    function loadSong(song) {

      songTitle.textContent =
        song.title;

      artistName.textContent =
        song.artist || "Unknown Artist";

      albumCover.src =
        defaultCover;

      audioElement.src =
        song.src;

      totalDurationEl.textContent =
        song.duration;

      seekBar.value = 0;

      currentTimeEl.textContent =
        "0:00";

      renderPlaylist();

    }


    /* ==========================================
       PLAY
    ========================================== */

    function togglePlay() {

      if (isPlaying) {

        pauseSong();

      } else {

        playSong();

      }

    }


    function playSong() {

      audioElement.play()
        .then(() => {

          isPlaying = true;

          playIcon.classList.remove(
            "fa-play"
          );

          playIcon.classList.add(
            "fa-pause"
          );

          albumCover.classList.remove(
            "paused-spin"
          );

        })
        .catch(error => {

          console.log(
            "Audio could not play:",
            error
          );

          isPlaying = false;

        });

    }


    function pauseSong() {

      isPlaying = false;

      audioElement.pause();

      playIcon.classList.remove(
        "fa-pause"
      );

      playIcon.classList.add(
        "fa-play"
      );

      albumCover.classList.add(
        "paused-spin"
      );

    }


    /* ==========================================
       PREVIOUS
    ========================================== */

    function prevSong() {

      currentSongIndex =
        (currentSongIndex - 1 + playlist.length)
        % playlist.length;

      loadSong(
        playlist[currentSongIndex]
      );

      if (isPlaying) {

        playSong();

      }

    }


    /* ==========================================
       NEXT
    ========================================== */

    function nextSong() {

      if (repeatMode === "one") {

        audioElement.currentTime = 0;

        playSong();

        return;

      }


      if (shuffleEnabled) {

        let randomIndex;

        do {

          randomIndex =
            Math.floor(
              Math.random() * playlist.length
            );

        } while (
          randomIndex === currentSongIndex &&
          playlist.length > 1
        );

        currentSongIndex =
          randomIndex;

      } else {

        currentSongIndex =
          (currentSongIndex + 1)
          % playlist.length;

      }


      loadSong(
        playlist[currentSongIndex]
      );


      if (isPlaying) {

        playSong();

      }

    }


    /* ==========================================
       TIME FORMAT
    ========================================== */

    function formatTime(seconds) {

      const mins =
        Math.floor(seconds / 60);

      const secs =
        Math.floor(seconds % 60);

      return `${mins}:${secs < 10 ? "0" : ""}${secs}`;

    }


    /* ==========================================
       PLAYLIST UI
    ========================================== */

    function renderPlaylist() {

      playlistContainer.innerHTML = "";

      songCount.textContent =
        `${playlist.length} Songs`;


      playlist.forEach((song, index) => {

        const item =
          document.createElement("div");

        item.className =
          "song-item " +
          (index === currentSongIndex
            ? "active"
            : "");


        item.innerHTML = `

          <div class="song-number">
            ${index + 1}
          </div>

          <div class="song-info">

            <div class="song-name">
              ${escapeHTML(song.title)}
            </div>

            <div class="song-artist">
              ${escapeHTML(song.artist || "Unknown Artist")}
            </div>

          </div>

          <div class="text-[10px] text-white/40">
            ${song.duration}
          </div>

        `;


        item.addEventListener(
          "click",
          () => {

            const wasPlaying =
              isPlaying;

            currentSongIndex =
              index;

            loadSong(
              playlist[currentSongIndex]
            );

            if (wasPlaying) {

              playSong();

            } else {

              playSong();

            }

          }
        );


        playlistContainer.appendChild(item);

      });

    }


    /* ==========================================
       ESCAPE HTML
    ========================================== */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;

    }


    /* ==========================================
       SHUFFLE
    ========================================== */

    shuffleBtn.addEventListener(
      "click",
      () => {

        shuffleEnabled =
          !shuffleEnabled;

        shuffleStatus.textContent =
          shuffleEnabled
            ? "On"
            : "Off";

        shuffleBtn.style.background =
          shuffleEnabled
            ? "rgba(255,255,255,0.16)"
            : "";

      }
    );


    /* ==========================================
       REPEAT
    ========================================== */

    repeatBtn.addEventListener(
      "click",
      () => {

        if (repeatMode === "all") {

          repeatMode = "one";

          repeatStatus.textContent =
            "Current song";

        } else {

          repeatMode = "all";

          repeatStatus.textContent =
            "All songs";

        }

      }
    );


    /* ==========================================
       BACKGROUND
    ========================================== */

    document.querySelectorAll(".bg-option")
      .forEach(option => {

        option.addEventListener(
          "click",
          () => {

            const newBackground =
              option.dataset.bg;

            backgroundImage.src =
              newBackground;


            document.querySelectorAll(
              ".bg-option"
            ).forEach(bg => {

              bg.classList.remove(
                "active"
              );

            });


            option.classList.add(
              "active"
            );

          }
        );

      });


    /* ==========================================
       BUTTON EVENTS
    ========================================== */

    playBtn.addEventListener(
      "click",
      togglePlay
    );

    prevBtn.addEventListener(
      "click",
      prevSong
    );

    nextBtn.addEventListener(
      "click",
      nextSong
    );


    /* ==========================================
       AUDIO PROGRESS
    ========================================== */

    audioElement.addEventListener(
      "timeupdate",
      () => {

        if (audioElement.duration) {

          const progressPercent =
            (audioElement.currentTime /
            audioElement.duration) * 100;

          seekBar.value =
            progressPercent;

          currentTimeEl.textContent =
            formatTime(
              audioElement.currentTime
            );

        }

      }
    );


    /* ==========================================
       SEEK
    ========================================== */

    seekBar.addEventListener(
      "input",
      () => {

        if (audioElement.duration) {

          const seekTime =
            (seekBar.value / 100) *
            audioElement.duration;

          audioElement.currentTime =
            seekTime;

        }

      }
    );


    /* ==========================================
       SONG ENDED
    ========================================== */

    audioElement.addEventListener(
      "ended",
      () => {

        if (repeatMode === "one") {

          audioElement.currentTime = 0;

          playSong();

        } else {

          nextSong();

        }

      }
    );


    /* ==========================================
       ERROR HANDLING
    ========================================== */

    audioElement.addEventListener(
      "error",
      () => {

        console.log(
          "Song failed to load"
        );

        setTimeout(() => {

          nextSong();

        }, 500);

      }
    );


    /* ==========================================
       INITIALIZE
    ========================================== */

    loadSong(
      playlist[currentSongIndex]
    );

    renderPlaylist();

  </script>

</body>
</html>

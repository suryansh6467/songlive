<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N0tSuryansh Music Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  font-family:"Plus Jakarta Sans",sans-serif;
  background:#000;
  color:#fff;
  overflow:hidden;
  user-select:none;
}

.background{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:#000;
}

.background::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.15);
  pointer-events:none;
}

.bg-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(.95) saturate(1.15);
  opacity:0;
  transition:opacity 1.6s cubic-bezier(.4,0,.2,1);

}

.bg-image.active{
  opacity:1;
}

.app{
  position:relative;
  z-index:5;
  width:100%;
  height:100dvh;
  min-height:100dvh;
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.header{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.clock{
  font-size:clamp(20px,3.5vw,32px);
  font-weight:800;
  letter-spacing:2px;
  color:rgba(255,255,255,.95);
  text-shadow:0 4px 20px rgba(0,0,0,.5);
}

.glass{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  box-shadow:
    0 25px 50px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.2);
}

.glass-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.22);
  color:#fff;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.25),
    0 8px 20px rgba(0,0,0,.3);
  cursor:pointer;
  transition:all .25s cubic-bezier(.4,0,.2,1);
}

.glass-btn:hover{
  background:rgba(255,255,255,.22);
  border-color:rgba(255,255,255,.4);
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.glass-btn:active{
  transform:scale(.93);
}

.menu-button{
  width:46px;
  height:46px;
  border-radius:50%;
  font-size:16px;
}

.main{
  width:100%;
  max-width:950px;
  margin:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.player{
  width:100%;
  padding:18px 24px;
  border-radius:36px;
  display:flex;
  align-items:center;
  gap:24px;
}

.cover-wrapper{
  flex-shrink:0;
  width:110px;
  height:110px;
  border-radius:50%;
  overflow:hidden;
  border:3px solid rgba(255,255,255,.4);
  box-shadow:
    0 15px 35px rgba(0,0,0,.5),
    0 0 25px rgba(255,255,255,.12);
  position:relative;
}

.cover{
  width:100%;
  height:100%;
  object-fit:cover;
  animation:spin 14s linear infinite;
  animation-play-state:paused;
  will-change:transform;
}

.cover.playing{
  animation-play-state:running;
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

.song-area{
  flex:1;
  min-width:0;
}

.song-title{
  margin:0;
  font-size:clamp(18px,2.2vw,24px);
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:.4px;
}

.artist{
  margin:4px 0 0;
  font-size:13px;
  color:rgba(255,255,255,.65);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.progress-row{
  width:100%;
  margin-top:14px;
  display:flex;
  align-items:center;
  gap:12px;
}

.playback-status{min-height:16px;margin:7px 0 0;font-size:11px;color:rgba(255,255,255,.75)}

.time{
  width:38px;
  font-size:11px;
  font-family:monospace;
  color:rgba(255,255,255,.7);
}

.time.right{text-align:left}
.time.left{text-align:right}

.seek{
  flex:1;
  width:100%;
  appearance:none;
  -webkit-appearance:none;
  height:6px;
  border-radius:10px;
  background:rgba(255,255,255,.2);
  outline:none;
  cursor:pointer;
}

.seek::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:15px;
  height:15px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 15px rgba(255,255,255,.8);
  cursor:pointer;
}

.seek::-moz-range-thumb{
  width:15px;
  height:15px;
  border:none;
  border-radius:50%;
  background:#fff;
  cursor:pointer;
}

.controls-container{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:16px;
}

.controls{
  display:flex;
  align-items:center;
  gap:14px;
}

.control{
  width:46px;
  height:46px;
  border-radius:50%;
  font-size:15px;
}

.play-button{
  width:58px;
  height:58px;
  border-radius:50%;
  font-size:20px;
  background:rgba(255,255,255,.22);
}

.play-icon{
  margin-left:2px;
}

.badge{
  margin-top:18px;
  padding:6px 18px;
  border:1px solid rgba(255,255,255,.4);
  border-radius:999px;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(12px);
  font-size:11px;
  font-weight:700;
  letter-spacing:3px;
  box-shadow:0 10px 25px rgba(0,0,0,.3);
}

/* MENU */

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  opacity:1;
  visibility:visible;
  transition:all .3s ease;
}

.modal.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.modal-box{
  width:100%;
  max-width:480px;
  max-height:88dvh;
  padding:22px;
  border-radius:30px;
  display:flex;
  flex-direction:column;
  transform:translateY(0) scale(1);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}

.modal.hidden .modal-box{
  transform:translateY(20px) scale(.95);
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:14px;
  margin-bottom:12px;
  border-bottom:1px solid rgba(255,255,255,.15);
}

.modal-title{
  margin:0;
  font-size:20px;
  font-weight:700;
}

.modal-subtitle{
  margin:3px 0 0;
  font-size:11px;
  color:rgba(255,255,255,.55);
}

.close-button{
  width:38px;
  height:38px;
  border-radius:50%;
}

.menu-content{
  overflow-y:auto;
  padding-right:4px;
  scrollbar-width:thin;
}

.menu-content::-webkit-scrollbar{
  width:5px;
}

.menu-content::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.3);
  border-radius:20px;
}

.option{
  width:100%;
  padding:12px 14px;
  margin-bottom:8px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  cursor:pointer;
  transition:all .2s ease;
}

.option:hover{
  background:rgba(255,255,255,.12);
}

.option-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.option-icon{
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.15);
  font-size:13px;
}

.option-title{
  margin:0;
  font-size:13px;
  font-weight:700;
}

.option-status{
  margin:2px 0 0;
  font-size:11px;
  color:rgba(255,255,255,.55);
}

.section-title{
  margin:16px 0 8px;
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);
}

.playlist-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
}

.song-count{
  font-size:10px;
  color:rgba(255,255,255,.55);
}

.songs-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:6px;
}

.song-item{
  padding:10px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  cursor:pointer;
  transition:all .2s ease;
}

.song-item:hover{
  background:rgba(255,255,255,.12);
}

.song-item.current{
  background:rgba(255,255,255,.2);
  border-color:rgba(255,255,255,.4);
}

.song-left{
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
}

.song-number{
  width:32px;
  height:32px;
  flex-shrink:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.1);
  font-size:11px;
  font-weight:700;
}

.song-text{
  min-width:0;
}

.song-name{
  margin:0;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-artist{
  margin:2px 0 0;
  font-size:10px;
  color:rgba(255,255,255,.58);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-duration{
  display:none;
}

@media(max-width:768px){
  .app{
    padding:14px;
  }

  .player{
    border-radius:28px;
    padding:14px;
    gap:14px;
    flex-wrap:wrap;
  }

  .cover-wrapper{
    width:84px;
    height:84px;
  }

  .song-area{
    flex:1;
    min-width:calc(100% - 110px);
  }

  .controls-container{
    width:100%;
    margin-top:12px;
  }
}

@media(max-width:380px){
  .cover-wrapper{
    width:70px;
    height:70px;
  }

  .song-title{
    font-size:15px;
  }

  .controls{
    gap:8px;
  }

  .control{
    width:40px;
    height:40px;
  }

  .play-button{
    width:50px;
    height:50px;
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition-duration:.01ms!important;
    animation-duration:.01ms!important;
  }
}
.hours-red{
  color:#ff0000 !important;
  text-shadow:0 0 12px rgba(255,0,0,.7);
}
</style>
</head>

        </button>

        <button id="next-btn"

        </button>

    </div>

  </div>

</main>
</div>

<!-- MUSIC MENU -->

<div id="playlist-modal" class="modal hidden">

      </div>

      <button id="close-menu"

        <i class="fa-solid fa-xmark"></i>

    </div>

    <div class="menu-content">

          <div class="option-icon">

          </div>

          <div>
            <h4 class="option-title">Shuffle</h4>
            <p id="shuffle-status" class="option-status">Off</p>
          </div>

        </div>

        <i class="fa-solid fa-chevron-right"></i>

      </div>

      <div id="repeat-toggle" class="option">

        <div class="option-left">

            <i class="fa-solid fa-repeat"></i>
          </div>

          <div>

        </span>

      </div>

      <div id="songs-list" class="songs-list"></div>

    </div>

  </div>

</div>

<audio id="audio-element" preload="auto" playsinline></audio>

/* =========================================================
   STATE
========================================================= */

let currentSongIndex = 0;
let isPlaying = false;
let isShuffle = true;
let repeatMode = 0;
let currentBgIndex = 0;
let activeLayer = 1;
let isSeeking = false;

let lastDisplayedSecond = -1;


/* =========================================================
   ELEMENTS
========================================================= */

const audio = document.getElementById("audio-element");
const playBtn = document.getElementById("play-btn");
const playIcon = document.getElementById("play-icon");
const prevBtn = document.getElementById("prev-btn");
const nextBtn = document.getElementById("next-btn");

const titleEl = document.getElementById("song-title");
const artistEl = document.getElementById("artist-name");
const coverEl = document.getElementById("album-cover");

const seekBar = document.getElementById("seek-bar");
const currentTimeEl = document.getElementById("current-time");
const totalDurationEl = document.getElementById("total-duration");
const playbackStatusEl = document.getElementById("playback-status");
function showPlaybackStatus(message){ playbackStatusEl.textContent = message; }
const clockEl = document.getElementById("digital-clock");
const hoursRed = document.querySelector(".hours-red");
const clockMinutes = document.getElementById("clock-minutes");
const clockSeconds = document.getElementById("clock-seconds");

const modal = document.getElementById("playlist-modal");
const menuBtn = document.getElementById("menu-btn");
const closeMenu = document.getElementById("close-menu");

const songsList = document.getElementById("songs-list");
const playlistCount = document.getElementById("playlist-count");

const shuffleToggle = document.getElementById("shuffle-toggle");
const shuffleStatus = document.getElementById("shuffle-status");

const repeatToggle = document.getElementById("repeat-toggle");
const repeatStatus = document.getElementById("repeat-status");

const bg1 = document.getElementById("bg1");
const bg2 = document.getElementById("bg2");


/* =========================================================
   AUDIO CONFIG
========================================================= */

audio.preload = "auto";
audio.playsInline = true;
function showPlaybackStatus(message){ playbackStatusEl.textContent = message; }

audio.addEventListener("error", () => {
  isPlaying = false;

  playIcon.className =
    "fa-solid fa-play play-icon";

  coverEl.classList.remove("playing");
  showPlaybackStatus("Unable to load this track. Check its link or select another song.");

  console.warn(
    "Unable to play:",
    playlist[currentSongIndex]?.title
  );
});


/* =========================================================
   LOCK-SCREEN MEDIA CONTROLS
========================================================= */
function updateMediaSession(song){
  if(!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist || "Unknown Artist",
    album: "N0tSuryansh Music Player",
    artwork: [{ src: defaultCover, sizes: "512x512", type: "image/jpeg" }]
  });
  for (const [action, handler] of Object.entries({
    play: () => playSong(), pause: () => pauseSong(),
    previoustrack: () => previousSong(), nexttrack: () => nextSong()
  })) {
    try { navigator.mediaSession.setActionHandler(action, handler); } catch (_) {}
  }
}
/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

  const now = new Date();

  hoursRed.textContent =
    String(now.getHours()).padStart(2,"0");

  clockMinutes.textContent =
    String(now.getMinutes()).padStart(2,"0");

  clockSeconds.textContent =
    String(now.getSeconds()).padStart(2,"0");
}

updateClock();

setInterval(updateClock,1000);


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(seconds){

  if(!Number.isFinite(seconds) || seconds < 0){
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return `${minutes}:${String(secs).padStart(2,"0")}`;

}


/* =========================================================
   LOAD SONG
========================================================= */

function loadSong(song, autoPlay = false){

  pauseSong();

  titleEl.textContent =
    song.title;

  artistEl.textContent =
    song.artist || "Unknown Artist";

  coverEl.src =
    defaultCover;

  seekBar.value = 0;

  currentTimeEl.textContent =
    "0:00";

  totalDurationEl.textContent =
    song.duration || "0:00";

  lastDisplayedSecond = -1;

  audio.src = song.src;
  audio.load();
  updateMediaSession(song);

  updateCurrentPlaylistItem();

  if(autoPlay){
    playSong();
  }

}


/* =========================================================
   PLAY
========================================================= */

async function playSong(){

  try{
    if(!audio.src){
      audio.src = playlist[currentSongIndex].src;
      audio.load();
    }
    showPlaybackStatus("Loading song…");
    showPlaybackStatus("Loading song…");
    await audio.play();
    showPlaybackStatus("");
    showPlaybackStatus("");

  }catch(error){

    showPlaybackStatus("Tap Play to start audio. Your browser blocked autoplay.");

    console.warn(
      "Playback blocked/error:",
      error
    );

  }

}


/* =========================================================
   PAUSE
========================================================= */

function pauseSong(){

  if(!audio.paused){
    audio.pause();
  }

  isPlaying = false;

  playIcon.className =
    "fa-solid fa-play play-icon";

  coverEl.classList.remove("playing");

  stopProgressAnimation();

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay(){

  if(audio.paused){

    playSong();

  }else{

    pauseSong();

  }

}


/* =========================================================
   AUDIO PLAY
========================================================= */

audio.addEventListener("play", () => {

  isPlaying = true;

  playIcon.className =
    "fa-solid fa-pause play-icon";

  coverEl.classList.add("playing");

  startProgressAnimation();

});


/* =========================================================
   AUDIO PAUSE
========================================================= */

audio.addEventListener("pause", () => {

  isPlaying = false;

  playIcon.className =
    "fa-solid fa-play play-icon";

  coverEl.classList.remove("playing");

  stopProgressAnimation();

});


/* =========================================================
   AUDIO METADATA
========================================================= */

audio.addEventListener(
  "loadedmetadata",
  () => {

    if(Number.isFinite(audio.duration)){

      totalDurationEl.textContent =
        formatTime(audio.duration);

    }

  }
);


/* =========================================================
   SMOOTH PROGRESS ENGINE
========================================================= */

function updateProgress(){

  if(
    !audio.duration ||
    !Number.isFinite(audio.duration) ||
    isSeeking
  ){
    return;

  }

  const percent =
    (audio.currentTime / audio.duration) * 100;

  seekBar.value =
    Math.max(0, Math.min(100, percent));

  const currentSecond =
    Math.floor(audio.currentTime);

  /*
    Text only changes once per second.
    This reduces unnecessary DOM updates.
  */

  if(currentSecond !== lastDisplayedSecond){

    currentTimeEl.textContent =
      formatTime(audio.currentTime);

    lastDisplayedSecond =
      currentSecond;

  }

}


function startProgressAnimation(){ updateProgress(); }
function stopProgressAnimation(){} 
audio.addEventListener("timeupdate", updateProgress);
audio.addEventListener("waiting", () => showPlaybackStatus("Buffering audio…"));
audio.addEventListener("playing", () => showPlaybackStatus(""));


/* =========================================================
   SEEKING
========================================================= */

seekBar.addEventListener(
  "pointerdown",
  () => {

    isSeeking = true;

  }
);


seekBar.addEventListener(
  "input",
  () => {

    if(!audio.duration){
      return;
    }

    const time =
      (Number(seekBar.value) / 100) *
      audio.duration;

    currentTimeEl.textContent =
      formatTime(time);

  }
);


seekBar.addEventListener(
  "change",
  () => {

    if(!audio.duration){

      isSeeking = false;
      return;

    }

    audio.currentTime =
      (Number(seekBar.value) / 100) *
      audio.duration;

    lastDisplayedSecond = -1;

    isSeeking = false;

    if(isPlaying){
      startProgressAnimation();
    }

  }
);


seekBar.addEventListener(
  "pointerup",
  () => {

    isSeeking = false;

  }
);


/* =========================================================
   NEXT SONG
========================================================= */

function nextSong(){

  if(repeatMode === 1){

    audio.currentTime = 0;

    playSong();

    return;

  }


  if(isShuffle){

    let nextIndex;

    do{

      nextIndex =
        Math.floor(
          Math.random() *
          playlist.length
        );

    }while(
      playlist.length > 1 &&
      nextIndex === currentSongIndex
    );

    currentSongIndex =
      nextIndex;

  }else{

    currentSongIndex =
      (currentSongIndex + 1) %
      playlist.length;

  }


  loadSong(
    playlist[currentSongIndex],
    true
  );

}


/* =========================================================
   PREVIOUS SONG
========================================================= */

function previousSong(){

  currentSongIndex =
    (currentSongIndex - 1 + playlist.length) %
    playlist.length;

  loadSong(
    playlist[currentSongIndex],
    true
  );

}


/* =========================================================
   SONG ENDED
========================================================= */

audio.addEventListener(
  "ended",
  () => {

    if(repeatMode === 1){

      audio.currentTime = 0;

      playSong();

    }else{

      nextSong();

    }

  }
);


/* =========================================================
   PLAYLIST RENDER
   Render ONCE instead of every song change
========================================================= */

function renderPlaylist(){

  const fragment =
    document.createDocumentFragment();

  playlist.forEach(
    (song,index) => {

      const item =
        document.createElement("div");

      item.className =
        "song-item";

      item.dataset.index =
        index;

      item.innerHTML = `

        <div class="song-left">

          <div class="song-number">
            ${index + 1}
          </div>

          <div class="song-text">

            <p class="song-name">
              ${escapeHTML(song.title)}
            </p>

            <p class="song-artist">
              ${escapeHTML(
                song.artist ||
                "Unknown Artist"
              )}
            </p>

          </div>

        </div>

      `;

      fragment.appendChild(item);

    }
  );

  songsList.replaceChildren(fragment);

  playlistCount.textContent =
    `${playlist.length} Songs`;

  updateCurrentPlaylistItem();

}


/* =========================================================
   UPDATE ONLY CURRENT ITEM
========================================================= */

function updateCurrentPlaylistItem(){

  const items =
    songsList.children;

  for(let i = 0; i < items.length; i++){

    const item =
      items[i];

    const number =
      item.querySelector(".song-number");

    if(i === currentSongIndex){

      item.classList.add("current");

      number.innerHTML =
        '<i class="fa-solid fa-volume-high"></i>';

    }else{

      item.classList.remove("current");

      number.textContent =
        i + 1;

    }

  }

}


/* =========================================================
   PLAYLIST CLICK
========================================================= */

songsList.addEventListener(
  "click",
  event => {

    const item =
      event.target.closest(".song-item");

    if(!item){
      return;
    }

    const index =
      Number(item.dataset.index);

    if(!Number.isInteger(index)){
      return;
    }

    currentSongIndex =
      index;

    loadSong(
      playlist[currentSongIndex],
      true
    );

    closeModalWindow();

  }
);


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   MENU
========================================================= */

function openModal(){

  modal.classList.remove("hidden");

  updateCurrentPlaylistItem();

}


function closeModalWindow(){

  modal.classList.add("hidden");

}


menuBtn.addEventListener(
  "click",
  openModal
);


closeMenu.addEventListener(
  "click",
  closeModalWindow
);


modal.addEventListener(
  "click",
  event => {

    if(event.target === modal){

      closeModalWindow();

    }

  }
);


/* =========================================================
   SHUFFLE
========================================================= */

shuffleToggle.addEventListener(
  "click",
  () => {

    isShuffle =
      !isShuffle;

    shuffleStatus.textContent =
      isShuffle
      ? "On"
      : "Off";

  }
);


/* =========================================================
   REPEAT
========================================================= */

repeatToggle.addEventListener(
  "click",
  () => {

    repeatMode =
      repeatMode === 0
      ? 1
      : 0;

    repeatStatus.textContent =
      repeatMode === 1
      ? "Single loop"
      : "All songs";

  }
);


/* =========================================================
   BACKGROUNDS
========================================================= */

const backgrounds = [

  "https://raw.githubusercontent.com/suryansh6467/songs/main/172404-your_name-mitsuha_miyamizu-taki_tachibana-anime-atmosphere-7680x4320.jpg",

  "https://raw.githubusercontent.com/suryansh6467/songs/main/anime-girl-meteor-streak-10k-0t.jpg",

  "https://raw.githubusercontent.com/suryansh6467/songs/main/horizon-clouds-sea-sunset-calm-8k-3q.jpg"

];


/* =========================================================
   PRELOAD BACKGROUNDS
========================================================= */

// Backgrounds load on demand so they do not compete with audio downloads.


/* =========================================================
   BACKGROUND SWITCH
========================================================= */

function changeBackground(index){

  if(
    index < 0 ||
    index >= backgrounds.length
  ){
    return;
  }

  const nextSrc =
    backgrounds[index];

  const img = new Image();
  img.decoding = "async";

  img.onload = () => {

    if(activeLayer === 1){

      bg2.src =
        nextSrc;

      bg2.classList.add("active");

      bg1.classList.remove("active");

      activeLayer = 2;

    }else{

      bg1.src =
        nextSrc;

      bg1.classList.add("active");

      bg2.classList.remove("active");

      activeLayer = 1;

    }

    currentBgIndex =
      index;

  };

  img.src =
    nextSrc;

}


let backgroundTimer = setInterval(() => { if (!document.hidden) changeBackground((currentBgIndex + 1) % backgrounds.length); }, 60000);
document.addEventListener("visibilitychange", () => { clearInterval(backgroundTimer); if (!document.hidden) backgroundTimer = setInterval(() => { if (!document.hidden) changeBackground((currentBgIndex + 1) % backgrounds.length); }, 60000); });


/* =========================================================
   BUTTON EVENTS
========================================================= */

playBtn.addEventListener(
  "click",
  togglePlay
);


prevBtn.addEventListener(
  "click",
  previousSong
);


nextBtn.addEventListener(
  "click",
  nextSong
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.target.tagName === "INPUT" ||
      event.target.tagName === "TEXTAREA"
    ){
      return;
    }

    if(event.code === "Space"){

      event.preventDefault();

      togglePlay();

    }

    else if(event.code === "ArrowRight"){

      nextSong();

    }

    else if(event.code === "ArrowLeft"){

      previousSong();

    }

    else if(event.key === "Escape"){

      closeModalWindow();

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

renderPlaylist();
// Start each visit with a different random song when possible.
let previousSongIndex = -1;
try {
  previousSongIndex = Number(localStorage.getItem("n0tSuryansh_song"));
  if (!Number.isInteger(previousSongIndex) || previousSongIndex < 0 || previousSongIndex >= playlist.length) {
    previousSongIndex = -1;
  }
} catch (e) {}

if (playlist.length > 1) {
  do {
    currentSongIndex = Math.floor(Math.random() * playlist.length);
  } while (currentSongIndex === previousSongIndex);
}

shuffleStatus.textContent = "On";
loadSong(playlist[currentSongIndex], true);


/* =========================================================
   SAVE LAST SONG
   Optional lightweight local storage
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    try{

      localStorage.setItem(
        "n0tSuryansh_song",
        currentSongIndex
      );

    }catch(e){}

  }
);

</script>

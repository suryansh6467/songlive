<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>N0tSuryansh Music Player</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#080808;color:white;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:16px}
button{font:inherit;color:inherit;cursor:pointer}
.glass-capsule{background:#ffffff1f;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid #ffffff40;box-shadow:0 20px 40px #0006,inset 0 1px 0 #ffffff26}
.btn-glass{background:#ffffff20;border:1px solid #ffffff40;backdrop-filter:blur(10px);transition:background .18s,transform .18s}
.btn-glass:active{transform:scale(.96)}
.bg-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.58);opacity:0;transition:opacity 1.5s}
.bg-slide.active{opacity:1}
.spinning{animation:spin 12s linear infinite}
.paused-spin{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.red-glow{color:#ff3b3b;text-shadow:0 0 10px #ff3b3bcc,0 0 25px #ff3b3b80}
input[type=range]{appearance:none;-webkit-appearance:none;width:100%;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:#ffffff50;border-radius:8px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:white;margin-top:-4.5px}
.custom-scrollbar::-webkit-scrollbar{width:5px}
.custom-scrollbar::-webkit-scrollbar-thumb{background:#ffffff50;border-radius:10px}
header{width:100%;display:flex;justify-content:space-between;align-items:center;z-index:10;padding:0 8px}
main{width:100%;max-width:900px;margin:auto;z-index:10;transform:translateY(15px)}
.player{border-radius:30px;padding:20px;display:flex;align-items:center;gap:22px}
.cover-wrap{width:110px;height:110px;flex-shrink:0;border-radius:50%;overflow:hidden;border:2px solid #ffffff70}
.cover-wrap img{width:100%;height:100%;object-fit:cover}
.song-info{flex:1;min-width:0}
.song-info h2{font-size:22px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-info p{margin:0;color:#ffffffa8;font-size:13px}
.progress{display:flex;align-items:center;gap:10px;margin-top:17px}
.progress span{font-size:11px;font-family:monospace;color:#ffffffd0;white-space:nowrap}
.controls{display:flex;align-items:center;gap:10px;flex-shrink:0}
.control-btn{width:44px;height:44px;border-radius:50%}
#play-btn{width:54px;height:54px;border-radius:50%}
.brand{text-align:center;margin-top:22px}
.brand span{display:inline-block;border:1px solid #ffffff80;padding:6px 17px;border-radius:30px;background:#0006;font-size:12px;letter-spacing:2px;font-weight:700}
#drawer-backdrop{position:fixed;inset:0;background:#000b;backdrop-filter:blur(5px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#drawer-backdrop.show{opacity:1;pointer-events:auto}
#playlist-drawer{position:fixed;top:0;right:0;width:min(100%,410px);height:100%;height:100dvh;z-index:50;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;padding:20px;border-radius:25px 0 0 25px;background:#111111ed;backdrop-filter:blur(25px);border-left:1px solid #ffffff30}
#playlist-drawer.open{transform:translateX(0)}
.drawer-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:15px;border-bottom:1px solid #ffffff25}
.drawer-header h3{font-size:18px;margin:0}
.close-btn{width:38px;height:38px;border-radius:50%}
#category-screen,#songs-screen{display:flex;flex-direction:column;flex:1;min-height:0}
#songs-screen[hidden],#category-screen[hidden]{display:none}
.drawer-subtitle{color:#ffffff8c;font-size:12px;margin:15px 0 10px}
.category-list{display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:2px 3px 10px}
.category-card{display:flex;align-items:center;gap:13px;padding:15px;border-radius:16px;text-align:left;width:100%;background:#ffffff0d;border:1px solid #ffffff18;transition:background .2s,border-color .2s}
.category-card:hover{background:#ffffff1b;border-color:#ffffff55}
.category-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:#ffffff16;font-size:17px;flex-shrink:0}
.category-copy{flex:1;min-width:0}
.category-copy strong{display:block;font-size:14px}
.category-copy small{display:block;color:#ffffff80;font-size:11px;margin-top:4px}
.category-arrow{color:#ffffff80}
.songs-header{display:flex;align-items:center;gap:10px;margin:14px 0 5px}
.back-btn{width:38px;height:38px;border-radius:12px;flex-shrink:0}
.songs-heading{flex:1;min-width:0}
.songs-heading h4{font-size:15px;margin:0}
.songs-heading p{font-size:11px;color:#ffffff80;margin:4px 0 0}
#playlist-search-wrap{position:relative;margin-top:12px;flex-shrink:0}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#ffffff80;pointer-events:none}
#playlist-search{width:100%;padding:12px 14px 12px 39px;border-radius:13px;border:1px solid #ffffff25;background:#ffffff0d;color:white;font:inherit;font-size:13px;outline:none}
#playlist-search::placeholder{color:#ffffff75}
#playlist-search:focus{border-color:#ffffff70;background:#ffffff12}
#playlist-items{flex:1;min-height:0;overflow-y:auto;margin-top:8px;padding-right:3px}
.song-entry{display:flex;align-items:center;gap:4px;margin-bottom:5px;border-radius:13px}
.language-group-title{padding:12px 4px 6px;color:#ffffff9c;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.song-item{flex:1;min-width:0;width:auto;display:flex;align-items:center;gap:12px;padding:11px;border-radius:13px;border:1px solid transparent;background:transparent;text-align:left;color:inherit;font:inherit}
.song-item:hover{background:#ffffff0d}
.song-item.current{background:#ffffff1c;border-color:#ffffff35}
.song-number{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#ffffff12;flex-shrink:0;font-size:12px}
.song-meta{flex:1;min-width:0}
.song-meta strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-meta small{display:block;font-size:11px;color:#ffffff80;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.song-item.current .song-meta strong{color:#ffd166}
.song-right{font-size:12px;color:#ffffff80}
.favorite-btn{width:40px;height:40px;display:grid;place-items:center;flex-shrink:0;border:1px solid transparent;border-radius:50%;background:transparent;color:#ffffff85;cursor:pointer}
.favorite-btn:hover{background:#ffffff12;border-color:#ffffff25}
.favorite-btn.active{color:#ff5c83;background:#ff5c8315;border-color:#ff5c8338}
@media(max-width:640px){
body{padding:12px}
header{padding:0 3px}
#digital-clock{font-size:23px!important}
.player{flex-direction:column;text-align:center;gap:15px;padding:19px 15px;border-radius:27px}
.cover-wrap{width:95px;height:95px}
.song-info{width:100%}
.song-info h2{text-align:center;font-size:19px}
.song-info>p{text-align:center}
.progress{gap:7px;margin-top:15px}
.controls{justify-content:center}
.control-btn{width:42px;height:42px}
#play-btn{width:50px;height:50px}
main{transform:translateY(5px)}
.brand{margin-top:17px}
#playlist-drawer{padding:17px}
}
@media(max-height:600px) and (max-width:640px){
body{padding:8px}
.player{gap:8px;padding:10px}
.cover-wrap{width:65px;height:65px}
.brand{margin-top:8px}
.song-info h2{font-size:16px}
.progress{margin-top:8px}
}
</style>
</head>

  if(haryanviTitles.includes(title))return "haryanvi";
  if(punjabiTitles.includes(title))return "punjabi";
  return "hindi";
};
const languageOrder={hindi:0,punjabi:1,haryanvi:2};
playlist.sort((a,b)=>languageOrder[languageForSong(a)]-languageOrder[languageForSong(b)]);

const categoryNames={
all:"All Songs",
hindi:"Hindi",
punjabi:"Punjabi",
crushFav: "Crush's Favorites ❤️",
favorites:"Favorites",
oneside:"One Side",
sad:"Bad Mood",
riding:"Riding",
talwiinder:"Talwiinder",
haryanvi:"Haryanvi"

};

const favoritesStorageKey="n0tsuryansh-favorites-v1";
function readFavoriteSongs(){
  try{
    const saved=JSON.parse(localStorage.getItem(favoritesStorageKey)||"[]");
    return new Set(Array.isArray(saved)?saved.filter(v=>typeof v==="string"):[]);
  }catch(e){return new Set()}
}
let favoriteSongSources=readFavoriteSongs();
let currentCategory="all";
let currentSongIndex=0;
let isSeeking=false;
let playRequestId=0;

const audio=document.getElementById("audio-element");
const playIcon=document.getElementById("play-icon");
const albumCover=document.getElementById("album-cover");
const songTitle=document.getElementById("song-title");
const artistName=document.getElementById("artist-name");
const seekBar=document.getElementById("seek-bar");
const currentTimeEl=document.getElementById("current-time");
const totalDurationEl=document.getElementById("total-duration");
const playbackStatus=document.getElementById("playback-status");
const drawer=document.getElementById("playlist-drawer");
const backdrop=document.getElementById("drawer-backdrop");
const categoryScreen=document.getElementById("category-screen");
const songsScreen=document.getElementById("songs-screen");
const playlistItems=document.getElementById("playlist-items");
const playlistSearch=document.getElementById("playlist-search");

function formatTime(value){
  if(!Number.isFinite(value)||value<0)return "0:00";
  return Math.floor(value/60)+":"+String(Math.floor(value%60)).padStart(2,"0");
}

function matchesCategory(song,category){
  const title=normalize(song.title);
  if(category==="all")return true;
  if(category==="hindi")return languageForSong(song)==="hindi";
  if(category==="punjabi")return languageForSong(song)==="punjabi";
  if(category==="favorites")return favoriteSongSources.has(song.src);
  if(category==="sad")return sadTitles.includes(title);
  if(category==="oneside")return onesideTitles.includes(title);
  if(category==="riding")return ridingTitles.includes(title);
  if(category==="talwiinder")return talwiinderTitles.includes(title);
  if(category==="haryanvi")return haryanviTitles.includes(title);
  if (category === "crushFav") {return crushFavTitles.includes(title);}
  return false;
}

function getFilteredSongs(category=currentCategory,includeSearch=true){
  const query=includeSearch?normalize(playlistSearch.value):"";
  return playlist.map((song,index)=>({song,index})).filter(({song})=>{
    const title=normalize(song.title);
    const artist=normalize(song.artist);
    return matchesCategory(song,category)&&
      (!query||title.includes(query)||artist.includes(query));
  });
}

function getCategoryIndices(){
  return getFilteredSongs(currentCategory,false).map(item=>item.index);
}

function openDrawer(){
  drawer.classList.add("open");
  backdrop.classList.add("show");
}
function closeDrawer(){
  drawer.classList.remove("open");
  backdrop.classList.remove("show");
}
function showCategories(){
  categoryScreen.hidden=false;
  songsScreen.hidden=true;
}
function showSongs(category){
  currentCategory=category;
  playlistSearch.value="";
  categoryScreen.hidden=true;
  songsScreen.hidden=false;
  document.getElementById("category-heading").textContent=categoryNames[category]||"Music";
  renderPlaylist();
}

document.getElementById("menu-toggle-btn").addEventListener("click",openDrawer);
document.getElementById("close-drawer-btn").addEventListener("click",closeDrawer);
document.getElementById("back-categories-btn").addEventListener("click",showCategories);
backdrop.addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});

document.querySelectorAll(".category-card").forEach(button=>{
  button.addEventListener("click",()=>showSongs(button.dataset.category));
});

function renderPlaylist(){
  const filtered=getFilteredSongs();
  document.getElementById("playlist-count").textContent=filtered.length+" songs";
  playlistItems.innerHTML="";

  if(!filtered.length){
    const empty=document.createElement("p");
    empty.textContent=currentCategory==="favorites"&&favoriteSongSources.size===0
      ?"No favorites yet. Tap a heart next to a song to save it."
      :playlistSearch.value.trim()?"No songs match your search.":"No songs found.";
    empty.style.cssText="text-align:center;color:#ffffff80;padding:25px 0";
    playlistItems.appendChild(empty);
    return;
  }

  const fragment=document.createDocumentFragment();
  let previousLanguage="";
  filtered.forEach(({song,index},position)=>{
    const language=languageForSong(song);
    if(currentCategory==="all"&&language!==previousLanguage){
      const heading=document.createElement("div");
      heading.className="language-group-title";
      heading.textContent=language.charAt(0).toUpperCase()+language.slice(1);
      fragment.appendChild(heading);
      previousLanguage=language;
    }
    const item=document.createElement("div");
    item.className="song-entry";

    const playButton=document.createElement("button");
    playButton.type="button";
    playButton.className="song-item"+(index===currentSongIndex?" current":"");
    playButton.setAttribute("aria-label","Play "+song.title);

    const number=document.createElement("span");
    number.className="song-number";
    number.innerHTML=index===currentSongIndex
      ?'<i class="fa-solid fa-'+(audio.paused?"music":"volume-high")+'"></i>'
      :String(position+1);

    const meta=document.createElement("span");
    meta.className="song-meta";
    const title=document.createElement("strong");
    title.textContent=song.title;
    const artist=document.createElement("small");
    artist.textContent=song.artist||"Unknown Artist";
    meta.append(title,artist);

    const right=document.createElement("span");
    right.className="song-right";
    right.innerHTML=index===currentSongIndex
      ?'<i class="fa-solid fa-volume-high"></i>'
      :'<i class="fa-solid fa-play"></i>';

    playButton.append(number,meta,right);
    playButton.addEventListener("click",()=>{
      currentSongIndex=index;
      closeDrawer();
      loadSong(true);
    });

    const favoriteButton=document.createElement("button");
    const isFavorite=favoriteSongSources.has(song.src);
    favoriteButton.type="button";
    favoriteButton.className="favorite-btn"+(isFavorite?" active":"");
    favoriteButton.setAttribute("aria-pressed",String(isFavorite));
    favoriteButton.setAttribute("aria-label",(isFavorite?"Remove ":"Add ")+song.title+" "+(isFavorite?"from":"to")+" favorites");
    favoriteButton.title=isFavorite?"Remove from favorites":"Add to favorites";
    favoriteButton.innerHTML='<i class="fa-solid fa-heart" aria-hidden="true"></i>';
    favoriteButton.addEventListener("click",()=>{
      if(favoriteSongSources.has(song.src))favoriteSongSources.delete(song.src);
      else favoriteSongSources.add(song.src);
      try{
        localStorage.setItem(favoritesStorageKey,JSON.stringify([...favoriteSongSources]));
      }catch(e){}
      renderPlaylist();
    });

    item.append(playButton,favoriteButton);
    fragment.appendChild(item);
  });
  playlistItems.appendChild(fragment);
}

function refreshCurrentSongRow(){
  if(!songsScreen.hidden)renderPlaylist();
}

function updatePlayUI(playing){
  playIcon.className=playing?"fa-solid fa-pause":"fa-solid fa-play";
  albumCover.classList.toggle("paused-spin",!playing);
  if("mediaSession" in navigator){
    try{navigator.mediaSession.playbackState=playing?"playing":"paused"}catch(e){}
  }
}

function updateMediaSession(){
  if(!("mediaSession" in navigator))return;
  const song=playlist[currentSongIndex];
  if(!song)return;
  try{
    if("MediaMetadata" in window){
      navigator.mediaSession.metadata=new MediaMetadata({
        title:song.title,
        artist:song.artist||"N0tSuryansh Player",
        album:"N0tSuryansh Music",
        artwork:[{src:defaultCover,sizes:"512x512",type:"image/jpeg"}]
      });
    }
    const actions={play:playSong,pause:pauseSong,previoustrack:prevSong,nexttrack:nextSong};
    Object.entries(actions).forEach(([action,handler])=>{
      try{navigator.mediaSession.setActionHandler(action,handler)}catch(e){}
    });
  }catch(e){}
}

function loadSong(autoplay=false){
  const song=playlist[currentSongIndex];
  if(!song)return;
  playRequestId++;
  audio.pause();
  audio.src=song.src;
  audio.load();
  songTitle.textContent=song.title;
  artistName.textContent=song.artist||"Unknown Artist";
  albumCover.src=defaultCover;
  seekBar.value=0;
  currentTimeEl.textContent="0:00";
  totalDurationEl.textContent="0:00";
  playbackStatus.textContent="Ready to play";
  updatePlayUI(false);
  updateMediaSession();
  refreshCurrentSongRow();
  if(autoplay)playSong();
}

async function playSong(){
  const requestId=++playRequestId;
  try{
    if(!audio.getAttribute("src"))loadSong(false);
    await audio.play();
    if(requestId!==playRequestId)return;
    updatePlayUI(true);
    playbackStatus.textContent="Now playing";
    updateMediaSession();
    refreshCurrentSongRow();
  }catch(error){
    if(requestId!==playRequestId)return;
    updatePlayUI(false);
    playbackStatus.textContent="Unable to play — check song URL";
    console.warn("Playback failed:",error);
  }
}

function pauseSong(){
  playRequestId++;
  audio.pause();
  updatePlayUI(false);
  playbackStatus.textContent="Paused";
  refreshCurrentSongRow();
}

document.getElementById("play-btn").addEventListener("click",()=>{
  if(audio.paused)playSong();
  else pauseSong();
});

function nextSong(){
  const indices=getCategoryIndices();
  if(!indices.length)return;
  let pos=indices.indexOf(currentSongIndex);
  if(pos<0)pos=-1;
  currentSongIndex=indices[(pos+1+indices.length)%indices.length];
  loadSong(true);
}

function prevSong(){
  if(audio.currentTime>3){
    audio.currentTime=0;
    return;
  }
  const indices=getCategoryIndices();
  if(!indices.length)return;
  let pos=indices.indexOf(currentSongIndex);
  if(pos<0)pos=0;
  currentSongIndex=indices[(pos-1+indices.length)%indices.length];
  loadSong(true);
}

document.getElementById("next-btn").addEventListener("click",nextSong);
document.getElementById("prev-btn").addEventListener("click",prevSong);
playlistSearch.addEventListener("input",renderPlaylist);

audio.addEventListener("loadedmetadata",()=>{
  totalDurationEl.textContent=formatTime(audio.duration);
});
audio.addEventListener("durationchange",()=>{
  if(Number.isFinite(audio.duration))totalDurationEl.textContent=formatTime(audio.duration);
});
audio.addEventListener("timeupdate",()=>{
  if(!Number.isFinite(audio.duration)||audio.duration<=0)return;
  currentTimeEl.textContent=formatTime(audio.currentTime);
  if(!isSeeking)seekBar.value=(audio.currentTime/audio.duration)*100;
});
seekBar.addEventListener("input",()=>{
  isSeeking=true;
  if(Number.isFinite(audio.duration)&&audio.duration>0){
    currentTimeEl.textContent=formatTime(Number(seekBar.value)*audio.duration/100);
  }
});
seekBar.addEventListener("change",()=>{
  if(Number.isFinite(audio.duration)&&audio.duration>0){
    audio.currentTime=Number(seekBar.value)*audio.duration/100;
  }
  isSeeking=false;
});
audio.addEventListener("play",()=>{
  updatePlayUI(true);
  playbackStatus.textContent="Now playing";
});
audio.addEventListener("pause",()=>{
  if(!audio.ended)updatePlayUI(false);
});
audio.addEventListener("ended",nextSong);
audio.addEventListener("error",()=>{
  updatePlayUI(false);
  playbackStatus.textContent="Song unavailable — use Next";
});
audio.addEventListener("waiting",()=>{
  if(!audio.paused)playbackStatus.textContent="Buffering...";
});
audio.addEventListener("playing",()=>playbackStatus.textContent="Now playing");

function updateClock(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,"0");
  const m=String(now.getMinutes()).padStart(2,"0");
  const s=String(now.getSeconds()).padStart(2,"0");
  document.getElementById("digital-clock").innerHTML=
    '<span class="red-glow">'+h+'</span>:'+m+':'+s;
}
updateClock();
setInterval(updateClock,1000);

const backgrounds=document.querySelectorAll(".bg-slide");
let bgIndex=0;
setInterval(()=>{
  backgrounds[bgIndex].classList.remove("active");
  bgIndex=(bgIndex+1)%backgrounds.length;
  backgrounds[bgIndex].classList.add("active");
},30000);

albumCover.addEventListener("error",()=>{
  albumCover.src="https://placehold.co/120x120/333/fff?text=Music";
});

function chooseStartupSong(){
  if(playlist.length<2)return 0;
  const lastSongKey="n0tsuryansh-last-startup-song-v1";
  let lastSongSource="";
  try{lastSongSource=localStorage.getItem(lastSongKey)||""}catch(e){}
  const choices=playlist.map((song,index)=>index)
    .filter(index=>playlist[index].src!==lastSongSource);
  const chosenIndex=choices.length
    ?choices[Math.floor(Math.random()*choices.length)]
    :Math.floor(Math.random()*playlist.length);
  try{localStorage.setItem(lastSongKey,playlist[chosenIndex].src)}catch(e){}
  return chosenIndex;
}

currentSongIndex=chooseStartupSong();
loadSong(false);
showCategories();
</script>
</body>
</html>

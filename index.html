<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N0tSuryansh Music Player</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
.glass-capsule{background:rgba(255,255,255,.12);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.25);box-shadow:0 20px 40px #0006,inset 0 1px 0 #ffffff26}
.btn-glass{background:#ffffff20;border:1px solid #ffffff40;backdrop-filter:blur(10px);box-shadow:inset 0 1px 2px #ffffff30,0 4px 10px #0004;transition:.2s}
.btn-glass:active{transform:scale(.95)}
input[type=range]{appearance:none;-webkit-appearance:none;width:100%;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:#ffffff50;border-radius:8px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:white;margin-top:-4.5px;box-shadow:0 0 10px #fff}
.spinning{animation:spin 12s linear infinite}
.paused-spin{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.red-glow{color:#ff3b3b;text-shadow:0 0 10px #ff3b3bcc,0 0 25px #ff3b3b80}
.bg-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.58);opacity:0;transition:opacity 1.5s}
.bg-slide.active{opacity:1}
.custom-scrollbar::-webkit-scrollbar{width:5px}
.custom-scrollbar::-webkit-scrollbar-thumb{background:#ffffff50;border-radius:10px}
.category-btn.active{background:#ffffff35;border-color:white;color:#ffd166}
.song-item{min-width:0}
#playlist-drawer{width:min(100%,400px)}
/* CENTER THE MUSIC PLAYER */
main {
  flex-grow: 0 !important;
  width: 100%;
  margin-top: auto !important;
  margin-bottom: auto !important;
  transform: translateY(25px);
}

/* Keep header at the top */
header {
  flex-shrink: 0;
}

/* Keep the player responsive on mobile */
@media (max-width: 640px) {
  main {
    transform: translateY(10px);
  }
}
</style>
</head>

<body class="relative flex flex-col justify-between items-center text-white p-3 sm:p-8 bg-black">

<div class="absolute inset-0 overflow-hidden pointer-events-none">
<img src="https://raw.githubusercontent.com/suryansh6467/songs/main/172404-your_name-mitsuha_miyamizu-taki_tachibana-anime-atmosphere-7680x4320.jpg" class="bg-slide active" alt="">
<img src="https://raw.githubusercontent.com/suryansh6467/songs/main/anime-girl-meteor-streak-10k-0t.jpg" class="bg-slide" alt="">
<img src="https://raw.githubusercontent.com/suryansh6467/songs/main/horizon-clouds-sea-sunset-calm-8k-3q.jpg" class="bg-slide" alt="">
</div>

<header class="w-full flex justify-between items-center z-10 px-2 sm:px-6">
<div id="digital-clock" class="text-xl sm:text-3xl font-bold tracking-wider">
<span class="red-glow">00</span>:00:00
</div>
<button id="menu-toggle-btn" class="btn-glass px-4 py-2 rounded-full flex items-center gap-2 text-sm font-semibold">
<i class="fa-solid fa-bars"></i> Playlist
</button>
</header>

<main class="flex flex-col items-center justify-center flex-grow z-10 my-auto w-full max-w-4xl px-1">
<div class="w-full glass-capsule rounded-3xl sm:rounded-full p-4 sm:p-5 flex flex-col md:flex-row items-center gap-4 sm:gap-6">

<div class="flex-shrink-0">
<div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full overflow-hidden border-2 border-white/40 shadow-2xl">
<img id="album-cover" src="https://raw.githubusercontent.com/suryansh6467/songs/main/1313eb05e394d398870fc6a320eec62e.jpg" class="w-full h-full object-cover spinning paused-spin" alt="Album cover">
</div>
</div>

<div class="flex-grow w-full min-w-0 flex flex-col justify-center gap-3 px-2">
<div class="text-left min-w-0">
<h2 id="song-title" class="text-lg sm:text-2xl font-bold truncate">Loading music...</h2>
<p id="artist-name" class="text-xs sm:text-sm text-white/70">N0tSuryansh Player</p>
</div>

<div class="flex items-center gap-3">
<span id="current-time" class="text-xs text-white/80 font-mono">0:00</span>
<input type="range" id="seek-bar" value="0" min="0" max="100">
<span id="total-duration" class="text-xs text-white/80 font-mono">0:00</span>
</div>
<p id="playback-status" class="text-xs text-white/60 text-left">Ready to play</p>
</div>

<div class="flex items-center gap-3">
<button id="prev-btn" class="btn-glass w-10 h-10 sm:w-12 sm:h-12 rounded-full"><i class="fa-solid fa-backward-step"></i></button>
<button id="play-btn" class="btn-glass w-12 h-12 sm:w-14 sm:h-14 rounded-full"><i id="play-icon" class="fa-solid fa-play"></i></button>
<button id="next-btn" class="btn-glass w-10 h-10 sm:w-12 sm:h-12 rounded-full"><i class="fa-solid fa-forward-step"></i></button>
</div>
</div>

<div class="mt-4">
<span class="border border-white/60 px-4 py-1 rounded-full bg-black/40 backdrop-blur-md text-xs sm:text-sm font-semibold tracking-widest">N0tSuryansh</span>
</div>
</main>

<div id="drawer-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 opacity-0 pointer-events-none transition-opacity duration-300"></div>

<aside id="playlist-drawer" class="fixed top-0 right-0 h-full glass-capsule z-50 translate-x-full transition-transform duration-300 flex flex-col p-4 sm:p-6 rounded-l-3xl">
<div class="flex items-center justify-between pb-4 border-b border-white/20">
<div class="flex items-center gap-2">
<i class="fa-solid fa-headphones text-lg"></i>
<h3 class="text-lg font-bold">Music Library</h3>
</div>
<button id="close-drawer-btn" class="btn-glass w-9 h-9 rounded-full"><i class="fa-solid fa-xmark"></i></button>
</div>

<div class="grid grid-cols-2 gap-2 mt-4">
<button data-category="all" class="category-btn active btn-glass rounded-xl py-3 text-sm font-semibold"><i class="fa-solid fa-music mr-1"></i> All Songs</button>
<button data-category="sad" class="category-btn btn-glass rounded-xl py-3 text-sm font-semibold"><i class="fa-solid fa-cloud-rain mr-1"></i> Sad</button>
<button data-category="driving" class="category-btn btn-glass rounded-xl py-3 text-sm font-semibold"><i class="fa-solid fa-car-side mr-1"></i> Driving</button>
<button data-category="talwiinder" class="category-btn btn-glass rounded-xl py-3 text-sm font-semibold"><i class="fa-solid fa-headphones mr-1"></i> Talwiinder</button>
</div>

<div class="flex items-center justify-between mt-4">
<h4 id="category-heading" class="font-semibold text-sm">All Songs</h4>
<span id="playlist-count" class="text-xs text-white/60">0 songs</span>
</div>

<div id="playlist-items" class="flex-grow overflow-y-auto mt-3 space-y-2 pr-1 custom-scrollbar"></div>
</aside>

<audio id="audio-element" preload="metadata" playsinline></audio>

function formatTime(value){
if(!Number.isFinite(value)||value<0)return "0:00";
const mins=Math.floor(value/60);
const secs=Math.floor(value%60);
return `${mins}:${String(secs).padStart(2,"0")}`;
}

function getFilteredSongs(){
return playlist.map((song,index)=>({song,index})).filter(({song})=>{
if(currentCategory==="all")return true;
if(currentCategory==="sad")return sadTitles.includes(song.title);
if(currentCategory==="driving")return drivingTitles.includes(song.title);
if(currentCategory==="talwiinder")return talwiinderTitles.includes(song.title);
return true;
});
}

playlistItems.innerHTML="";
const filtered=getFilteredSongs();
document.getElementById("category-heading").textContent=categoryNames[currentCategory];
document.getElementById("playlist-count").textContent=filtered.length+" songs";

if(!filtered.length){
playlistItems.innerHTML='<p class="text-center text-white/60 py-8">No songs found.</p>';
return;
}

filtered.forEach(({song,index},position)=>{
const item=document.createElement("button");
item.type="button";
item.className="song-item w-full text-left p-3 rounded-xl flex items-center gap-3 border transition-all "+(index===currentSongIndex?"bg-white/20 border-white/40":"border-transparent hover:bg-white/10");

const num=document.createElement("div");
num.className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center flex-shrink-0 text-sm";
if(index===currentSongIndex){
num.innerHTML='<i class="fa-solid fa-compact-disc text-amber-300 spinning"></i>';
}else{
num.textContent=String(position+1);
}

const info=document.createElement("div");
info.className="min-w-0 flex-1";
const title=document.createElement("div");
title.className="font-semibold text-sm truncate "+(index===currentSongIndex?"text-amber-300":"");
title.textContent=song.title;
const artist=document.createElement("div");
artist.className="text-xs text-white/60 truncate";
artist.textContent=song.artist;
info.append(title,artist);

const icon=document.createElement("i");
icon.className=index===currentSongIndex&&isPlaying?"fa-solid fa-volume-high text-amber-300":"fa-solid fa-play text-white/50 text-xs";

item.append(num,info,icon);
item.addEventListener("click",()=>{
currentSongIndex=index;
loadSong(true);
});
playlistItems.appendChild(item);
});
}

function selectCategory(category){
currentCategory=category;
document.querySelectorAll(".category-btn").forEach(button=>{
button.classList.toggle("active",button.dataset.category===category);
});
renderPlaylist();
}

document.querySelectorAll(".category-btn").forEach(button=>{
button.addEventListener("click",()=>selectCategory(button.dataset.category));
});

function openDrawer(){
drawer.classList.remove("translate-x-full");
backdrop.classList.remove("opacity-0","pointer-events-none");
}

function closeDrawer(){
drawer.classList.add("translate-x-full");
backdrop.classList.add("opacity-0","pointer-events-none");
}

document.getElementById("menu-toggle-btn").addEventListener("click",openDrawer);
document.getElementById("close-drawer-btn").addEventListener("click",closeDrawer);
backdrop.addEventListener("click",closeDrawer);

document.addEventListener("keydown",event=>{
if(event.key==="Escape")closeDrawer();
});

function updatePlayUI(playing){
isPlaying=playing;
playIcon.className=playing?"fa-solid fa-pause":"fa-solid fa-play";
albumCover.classList.toggle("paused-spin",!playing);
renderPlaylist();
}

/* MEDIA SESSION INTEGRATION FOR BACKGROUND PLAYBACK */
function updateMediaSession() {
  if ('mediaSession' in navigator) {
    const song = playlist[currentSongIndex];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: song.artist || "N0tSuryansh Player",
      album: "N0tSuryansh Music",
      artwork: [
        { src: defaultCover, sizes: '512x512', type: 'image/jpeg' }
      ]
    });

    navigator.mediaSession.setActionHandler('play', () => playSong());
    navigator.mediaSession.setActionHandler('pause', () => pauseSong());
    navigator.mediaSession.setActionHandler('previoustrack', () => prevSong());
    navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
  }
}

function loadSong(autoplay=false){
const song=playlist[currentSongIndex];
if(!song)return;

audio.pause();
audio.src=song.src;
audio.load();

songTitle.textContent=song.title;
artistName.textContent=song.artist||"Unknown Artist";
albumCover.src=defaultCover;
seekBar.value=0;
currentTimeEl.textContent="0:00";
totalDurationEl.textContent="0:00";
playbackStatus.textContent="Ready to play";
updatePlayUI(false);

updateMediaSession();

if(autoplay)playSong();
}

async function playSong(){
try{
if(!audio.src)loadSong(false);
await audio.play();
updatePlayUI(true);
playbackStatus.textContent="Now playing";
}catch(error){
updatePlayUI(false);
playbackStatus.textContent="Unable to play — check song URL";
console.warn("Playback failed:",error);
}
}

function pauseSong(){
audio.pause();
updatePlayUI(false);
playbackStatus.textContent="Paused";
}

playBtn.addEventListener("click",()=>{
if(audio.paused)playSong();
else pauseSong();
});

function nextSong(){
currentSongIndex=(currentSongIndex+1)%playlist.length;
loadSong(true);
}

function prevSong(){
if(audio.currentTime>3){
audio.currentTime=0;
return;
}
currentSongIndex=(currentSongIndex-1+playlist.length)%playlist.length;
loadSong(true);
}

document.getElementById("next-btn").addEventListener("click",nextSong);
document.getElementById("prev-btn").addEventListener("click",prevSong);

audio.addEventListener("loadedmetadata",()=>{
totalDurationEl.textContent=formatTime(audio.duration);
});

audio.addEventListener("durationchange",()=>{
if(Number.isFinite(audio.duration)){
totalDurationEl.textContent=formatTime(audio.duration);
}
});

audio.addEventListener("timeupdate",()=>{
if(!Number.isFinite(audio.duration))return;
currentTimeEl.textContent=formatTime(audio.currentTime);
if(!isSeeking){
seekBar.value=(audio.currentTime/audio.duration)*100;
}
});

seekBar.addEventListener("input",()=>{
isSeeking=true;
if(Number.isFinite(audio.duration)){
currentTimeEl.textContent=formatTime((seekBar.value/100)*audio.duration);
}
});

seekBar.addEventListener("change",()=>{
if(Number.isFinite(audio.duration)){
audio.currentTime=(seekBar.value/100)*audio.duration;
}
isSeeking=false;
});

audio.addEventListener("play",()=>{
updatePlayUI(true);
playbackStatus.textContent="Now playing";
});

audio.addEventListener("pause",()=>{
if(!audio.ended)updatePlayUI(false);
});

audio.addEventListener("ended",nextSong);

audio.addEventListener("error",()=>{
updatePlayUI(false);
playbackStatus.textContent="Song unavailable — use Next";
});

function updateClock(){
const now=new Date();
const h=String(now.getHours()).padStart(2,"0");
const m=String(now.getMinutes()).padStart(2,"0");
const s=String(now.getSeconds()).padStart(2,"0");
document.getElementById("digital-clock").innerHTML=
`<span class="red-glow">${h}</span>:${m}:${s}`;
}
setInterval(updateClock,1000);
updateClock();

const backgrounds=document.querySelectorAll(".bg-slide");
let bgIndex=0;
setInterval(()=>{
backgrounds[bgIndex].classList.remove("active");
bgIndex=(bgIndex+1)%backgrounds.length;
backgrounds[bgIndex].classList.add("active");
},30000);

albumCover.addEventListener("error",()=>{
albumCover.src="https://placehold.co/120x120/333/fff?text=Music";
});

loadSong(false);
renderPlaylist();

/* Screen Wake Lock Fix */
let screenWakeLock = null;

async function requestScreenWakeLock() {
  if (!("wakeLock" in navigator)) return;
  try {
    if (document.visibilityState === "visible" && !screenWakeLock) {
      screenWakeLock = await navigator.wakeLock.request("screen");
      screenWakeLock.addEventListener("release", () => {
        screenWakeLock = null;
      });
    }
  } catch (error) {
    console.log("Wake Lock unavailable:", error);
  }
}

async function releaseScreenWakeLock() {
  if (screenWakeLock) {
    await screenWakeLock.release();
    screenWakeLock = null;
  }
}

audio.addEventListener("play", requestScreenWakeLock);
audio.addEventListener("pause", releaseScreenWakeLock);
audio.addEventListener("ended", releaseScreenWakeLock);

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && !audio.paused) {
    await requestScreenWakeLock();
  }
});
</script>

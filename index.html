<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N0tSuryansh Music Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* =========================
   RESET
========================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  font-family: "Plus Jakarta Sans", sans-serif;
  background: #000;
  color: #fff;
  overflow: hidden;
  user-select: none;
}

/* =========================
   BACKGROUND
========================= */

.background {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: #000;
}

.background::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.28),
      rgba(0,0,0,.48)
    );
  pointer-events: none;
}

.bg-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(.55);
  opacity: 0;
  transition: opacity 1.4s ease;
  will-change: opacity;
}

.bg-image.active {
  opacity: 1;
}

/* =========================
   APP
========================= */

.app {
  position: relative;
  z-index: 5;
  width: 100%;
  height: 100dvh;
  min-height: 100dvh;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* =========================
   HEADER
========================= */

.header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.clock {
  font-size: clamp(22px, 4vw, 38px);
  font-weight: 700;
  letter-spacing: 2px;
  color: rgba(255,255,255,.95);
  text-shadow: 0 3px 15px rgba(0,0,0,.45);
}

/* =========================
   GLASS
========================= */

.glass {
  background: rgba(255,255,255,.11);
  border: 1px solid rgba(255,255,255,.25);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow:
    0 20px 45px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,.18);
}

/* =========================
   BUTTON
========================= */

.glass-btn {
  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(255,255,255,.3);
  color: #fff;
  background: rgba(255,255,255,.16);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.2),
    0 5px 15px rgba(0,0,0,.25);

  cursor: pointer;

  transition:
    transform .18s ease,
    background .18s ease,
    border-color .18s ease;
}

.glass-btn:hover {
  background: rgba(255,255,255,.24);
  border-color: rgba(255,255,255,.4);
}

.glass-btn:active {
  transform: scale(.94);
}

/* Menu */

.menu-button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 16px;
}

/* =========================
   MAIN
========================= */

.main {
  width: 100%;
  max-width: 1050px;
  margin: auto;
  padding: 20px 8px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* =========================
   PLAYER
========================= */

.player {
  width: 100%;
  padding: 14px;

  border-radius: 999px;

  display: flex;
  align-items: center;
  gap: 22px;
}

/* =========================
   COVER
========================= */

.cover-wrapper {
  flex-shrink: 0;
  width: 104px;
  height: 104px;

  border-radius: 50%;
  overflow: hidden;

  border: 2px solid rgba(255,255,255,.4);

  box-shadow:
    0 10px 30px rgba(0,0,0,.45),
    0 0 20px rgba(255,255,255,.08);
}

.cover {
  width: 100%;
  height: 100%;
  object-fit: cover;

  animation: spin 12s linear infinite;
  animation-play-state: paused;

  will-change: transform;
}

.cover.playing {
  animation-play-state: running;
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

/* =========================
   SONG INFO
========================= */

.song-area {
  flex: 1;
  min-width: 0;
}

.song-title {
  margin: 0;

  font-size: clamp(17px, 2.5vw, 24px);
  font-weight: 700;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  letter-spacing: .3px;
}

.artist {
  margin: 4px 0 0;

  font-size: 13px;
  color: rgba(255,255,255,.68);

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* =========================
   PROGRESS
========================= */

.progress-row {
  width: 100%;
  margin-top: 13px;

  display: flex;
  align-items: center;
  gap: 10px;
}

.time {
  width: 38px;

  font-size: 11px;
  font-family: monospace;

  color: rgba(255,255,255,.75);
}

.time.right {
  text-align: left;
}

.time.left {
  text-align: right;
}

.seek {
  flex: 1;
  width: 100%;

  appearance: none;
  -webkit-appearance: none;

  height: 5px;

  border-radius: 10px;

  background: rgba(255,255,255,.25);

  outline: none;

  cursor: pointer;
}

.seek::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;

  width: 14px;
  height: 14px;

  border-radius: 50%;

  background: #fff;

  box-shadow: 0 0 12px rgba(255,255,255,.7);

  cursor: pointer;
}

.seek::-moz-range-thumb {
  width: 14px;
  height: 14px;

  border: none;
  border-radius: 50%;

  background: #fff;

  cursor: pointer;
}

/* =========================
   CONTROLS
========================= */

.controls {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 5px;
}

.control {
  width: 48px;
  height: 48px;
  border-radius: 50%;
}

.play-button {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  font-size: 19px;
}

.play-icon {
  margin-left: 2px;
}

/* =========================
   BADGE
========================= */

.badge {
  margin-top: 15px;

  padding: 6px 16px;

  border: 1px solid rgba(255,255,255,.5);
  border-radius: 999px;

  background: rgba(0,0,0,.35);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  font-size: 11px;
  font-weight: 600;

  letter-spacing: 3px;

  box-shadow: 0 8px 20px rgba(0,0,0,.3);
}

/* =========================
   MODAL
========================= */

.modal {
  position: fixed;
  inset: 0;

  z-index: 50;

  padding: 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,.72);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  opacity: 1;
  visibility: visible;

  transition:
    opacity .25s ease,
    visibility .25s ease;
}

.modal.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.modal-box {
  width: 100%;
  max-width: 460px;
  max-height: 90dvh;

  padding: 20px;

  border-radius: 28px;

  display: flex;
  flex-direction: column;

  transform: translateY(0) scale(1);

  transition: transform .25s ease;
}

.modal.hidden .modal-box {
  transform: translateY(15px) scale(.97);
}

/* =========================
   MODAL HEADER
========================= */

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding-bottom: 12px;
  margin-bottom: 12px;

  border-bottom: 1px solid rgba(255,255,255,.16);
}

.modal-title {
  margin: 0;
  font-size: 20px;
}

.modal-subtitle {
  margin: 3px 0 0;
  font-size: 11px;
  color: rgba(255,255,255,.55);
}

.close-button {
  width: 38px;
  height: 38px;
  border-radius: 50%;
}

/* =========================
   MENU CONTENT
========================= */

.menu-content {
  overflow-y: auto;
  padding-right: 3px;

  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.3) transparent;
}

.menu-content::-webkit-scrollbar {
  width: 5px;
}

.menu-content::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.3);
  border-radius: 20px;
}

/* =========================
   OPTIONS
========================= */

.option {
  width: 100%;

  padding: 13px;

  margin-bottom: 9px;

  border-radius: 18px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background: rgba(255,255,255,.07);

  border: 1px solid rgba(255,255,255,.1);

  cursor: pointer;

  transition:
    background .18s ease,
    transform .18s ease;
}

.option:hover {
  background: rgba(255,255,255,.14);
}

.option:active {
  transform: scale(.985);
}

.option-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.option-icon {
  width: 40px;
  height: 40px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,.16);
}

.option-title {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
}

.option-status {
  margin: 2px 0 0;
  font-size: 11px;
  color: rgba(255,255,255,.55);
}

/* =========================
   BACKGROUND SECTION
========================= */

.section-title {
  margin: 15px 0 8px;

  font-size: 10px;
  font-weight: 700;

  letter-spacing: 1.5px;
  text-transform: uppercase;

  color: rgba(255,255,255,.55);
}

.background-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.bg-thumb {
  height: 68px;

  overflow: hidden;

  border-radius: 12px;

  border: 2px solid transparent;

  cursor: pointer;

  transition:
    transform .2s ease,
    border-color .2s ease;
}

.bg-thumb:hover {
  transform: scale(1.025);
}

.bg-thumb.active {
  border-color: rgba(255,255,255,.9);
}

.bg-thumb img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}

/* =========================
   PLAYLIST
========================= */

.playlist-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-top: 16px;
}

.song-count {
  font-size: 10px;
  color: rgba(255,255,255,.55);
}

.songs-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.song-item {
  padding: 10px;

  border-radius: 15px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border: 1px solid rgba(255,255,255,.1);

  background: rgba(255,255,255,.05);

  cursor: pointer;

  transition:
    background .18s ease,
    border-color .18s ease;
}

.song-item:hover {
  background: rgba(255,255,255,.13);
}

.song-item.current {
  background: rgba(255,255,255,.22);
  border-color: rgba(255,255,255,.45);
}

.song-left {
  min-width: 0;

  display: flex;
  align-items: center;
  gap: 10px;
}

.song-number {
  width: 35px;
  height: 35px;

  flex-shrink: 0;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,.13);

  font-size: 12px;
  font-weight: 700;
}

.song-text {
  min-width: 0;
}

.song-name {
  margin: 0;

  font-size: 12px;
  font-weight: 700;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-artist {
  margin: 2px 0 0;

  font-size: 10px;
  color: rgba(255,255,255,.58);

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-duration {
  flex-shrink: 0;

  margin-left: 8px;

  font-family: monospace;
  font-size: 10px;

  color: rgba(255,255,255,.55);
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

  .app {
    padding: 14px;
  }

  .main {
    padding: 15px 0;
  }

  .player {
    border-radius: 30px;

    padding: 14px;

    gap: 12px;

    flex-wrap: wrap;
  }

  .cover-wrapper {
    width: 78px;
    height: 78px;
  }

  .song-area {
    flex: 1;
    min-width: calc(100% - 100px);
  }

  .controls {
    width: 100%;

    justify-content: center;

    padding-top: 2px;
  }

  .control {
    width: 44px;
    height: 44px;
  }

  .play-button {
    width: 54px;
    height: 54px;
  }

  .badge {
    margin-top: 11px;
  }
}

@media (max-width: 380px) {

  .player {
    padding: 12px;
  }

  .cover-wrapper {
    width: 68px;
    height: 68px;
  }

  .song-title {
    font-size: 15px;
  }

  .artist {
    font-size: 11px;
  }

  .progress-row {
    gap: 6px;
  }

  .clock {
    font-size: 21px;
  }
}

/* Reduce motion when device requests it */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
  }
}
</style>
</head>

      </div>

          </div>

          <div>

              Shuffle

            <p id="shuffle-status" class="option-status">
              Off

  </div>

</div>


<!-- AUDIO -->

/* =========================
   STATE
========================= */

let currentSongIndex =
  Math.floor(Math.random() * playlist.length);

let isPlaying = false;
let isShuffle = false;
let repeatMode = 0;

let currentBgIndex = 0;
let activeLayer = 1;


/* =========================
   ELEMENTS
========================= */

const audio = document.getElementById("audio-element");

const playBtn = document.getElementById("play-btn");
const playIcon = document.getElementById("play-icon");

const prevBtn = document.getElementById("prev-btn");
const nextBtn = document.getElementById("next-btn");

const titleEl = document.getElementById("song-title");
const artistEl = document.getElementById("artist-name");

const coverEl = document.getElementById("album-cover");

const seekBar = document.getElementById("seek-bar");

const currentTimeEl =
  document.getElementById("current-time");

const totalDurationEl =
  document.getElementById("total-duration");

const clockEl =
  document.getElementById("digital-clock");

const modal =
  document.getElementById("playlist-modal");

const menuBtn =
  document.getElementById("menu-btn");

const closeMenu =
  document.getElementById("close-menu");

const songsList =
  document.getElementById("songs-list");

const playlistCount =
  document.getElementById("playlist-count");

const shuffleToggle =
  document.getElementById("shuffle-toggle");

const shuffleStatus =
  document.getElementById("shuffle-status");

const repeatToggle =
  document.getElementById("repeat-toggle");

const repeatStatus =
  document.getElementById("repeat-status");

const bg1 =
  document.getElementById("bg1");

const bg2 =
  document.getElementById("bg2");


/* =========================
   CLOCK
========================= */

function updateClock() {

  const now = new Date();

  clockEl.textContent =
    now.toLocaleTimeString("en-GB", {
      hour12: false
    });

}

updateClock();

setInterval(updateClock, 1000);


/* =========================
   TIME FORMAT
========================= */

function formatTime(seconds) {

  if (!Number.isFinite(seconds)) {
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return `${minutes}:${secs
    .toString()
    .padStart(2, "0")}`;

}


/* =========================
   LOAD SONG
========================= */

function loadSong(song) {

  titleEl.textContent =
    song.title;

  artistEl.textContent =
    song.artist || "Unknown Artist";

  coverEl.src =
    defaultCover;

  audio.src =
    song.src;

  audio.load();

  seekBar.value = 0;

  currentTimeEl.textContent =
    "0:00";

  totalDurationEl.textContent =
    song.duration || "0:00";

}


/* =========================
   PLAY
========================= */

async function playSong() {

  try {

    await audio.play();

    isPlaying = true;

    playIcon.classList.remove(
      "fa-play"
    );

    playIcon.classList.add(
      "fa-pause"
    );

    coverEl.classList.add(
      "playing"
    );

  } catch (error) {

    console.log(
      "Audio could not play:",
      error
    );

    isPlaying = false;

  }

}


/* =========================
   PAUSE
========================= */

function pauseSong() {

  audio.pause();

  isPlaying = false;

  playIcon.classList.remove(
    "fa-pause"
  );

  playIcon.classList.add(
    "fa-play"
  );

  coverEl.classList.remove(
    "playing"
  );

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay() {

  if (isPlaying) {
    pauseSong();
  } else {
    playSong();
  }

}


/* =========================
   NEXT SONG
========================= */

function nextSong() {

  if (repeatMode === 1) {

    audio.currentTime = 0;

    playSong();

    return;

  }


  if (isShuffle) {

    let nextIndex;

    do {

      nextIndex =
        Math.floor(
          Math.random() *
          playlist.length
        );

    } while (
      playlist.length > 1 &&
      nextIndex === currentSongIndex
    );

    currentSongIndex =
      nextIndex;

  } else {

    currentSongIndex =
      (currentSongIndex + 1) %
      playlist.length;

  }


  const shouldPlay =
    isPlaying;

  loadSong(
    playlist[currentSongIndex]
  );

  if (shouldPlay) {
    playSong();
  }

  if (!modal.classList.contains("hidden")) {
    renderPlaylist();
  }

}


/* =========================
   PREVIOUS SONG
========================= */

function previousSong() {

  currentSongIndex =
    (currentSongIndex - 1 + playlist.length) %
    playlist.length;

  const shouldPlay =
    isPlaying;

  loadSong(
    playlist[currentSongIndex]
  );

  if (shouldPlay) {
    playSong();
  }

  if (!modal.classList.contains("hidden")) {
    renderPlaylist();
  }

}


/* =========================
   PROGRESS
========================= */

audio.addEventListener(
  "timeupdate",
  () => {

    if (!audio.duration) {
      return;
    }

    const percentage =
      (audio.currentTime /
       audio.duration) * 100;

    seekBar.value =
      percentage;

    currentTimeEl.textContent =
      formatTime(
        audio.currentTime
      );

  }
);


/* =========================
   METADATA
========================= */

audio.addEventListener(
  "loadedmetadata",
  () => {

    if (
      Number.isFinite(
        audio.duration
      )
    ) {

      totalDurationEl.textContent =
        formatTime(
          audio.duration
        );

    }

  }
);


/* =========================
   SEEK
========================= */

seekBar.addEventListener(
  "input",
  () => {

    if (!audio.duration) {
      return;
    }

    audio.currentTime =
      (seekBar.value / 100) *
      audio.duration;

  }
);


/* =========================
   AUDIO EVENTS
========================= */

audio.addEventListener(
  "ended",
  nextSong
);

audio.addEventListener(
  "play",
  () => {

    isPlaying = true;

    playIcon.classList.remove(
      "fa-play"
    );

    playIcon.classList.add(
      "fa-pause"
    );

    coverEl.classList.add(
      "playing"
    );

  }
);

audio.addEventListener(
  "pause",
  () => {

    isPlaying = false;

    playIcon.classList.remove(
      "fa-pause"
    );

    playIcon.classList.add(
      "fa-play"
    );

    coverEl.classList.remove(
      "playing"
    );

  }
);


/* =========================
   ERROR HANDLING
========================= */

audio.addEventListener(
  "error",
  () => {

    console.log(
      "Unable to load:",
      playlist[currentSongIndex].title
    );

    setTimeout(() => {

      if (playlist.length > 1) {
        nextSong();
      }

    }, 250);

  }
);


/* =========================
   BUTTON EVENTS
========================= */

playBtn.addEventListener(
  "click",
  togglePlay
);

prevBtn.addEventListener(
  "click",
  previousSong
);

nextBtn.addEventListener(
  "click",
  nextSong
);


/* =========================
   MODAL
========================= */

function openModal() {

  modal.classList.remove(
    "hidden"
  );

  renderPlaylist();

}


function closeModalWindow() {

  modal.classList.add(
    "hidden"
  );

}


menuBtn.addEventListener(
  "click",
  openModal
);

closeMenu.addEventListener(
  "click",
  closeModalWindow
);


modal.addEventListener(
  "click",
  event => {

    if (
      event.target === modal
    ) {

      closeModalWindow();

    }

  }
);


/* =========================
   ESC CLOSE
========================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      closeModalWindow();

    }

  }
);


/* =========================
   PLAYLIST
========================= */

function renderPlaylist() {

  playlistCount.textContent =
    `${playlist.length} Songs`;

  songsList.innerHTML = "";

  playlist.forEach(
    (song, index) => {

      const item =
        document.createElement("div");

      const isCurrent =
        index === currentSongIndex;

      item.className =
        "song-item" +
        (isCurrent
          ? " current"
          : "");

      item.innerHTML = `

        <div class="song-left">

          <div class="song-number">

            ${
              isCurrent
              ? '<i class="fa-solid fa-volume-high"></i>'
              : index + 1
            }

          </div>

          <div class="song-text">

            <p class="song-name">
              ${escapeHTML(song.title)}
            </p>

            <p class="song-artist">
              ${escapeHTML(song.artist || "Unknown Artist")}
            </p>

          </div>

        </div>

        <span class="song-duration">
          ${escapeHTML(song.duration || "0:00")}
        </span>

      `;


      item.addEventListener(
        "click",
        () => {

          currentSongIndex =
            index;

          loadSong(
            playlist[currentSongIndex]
          );

          playSong();

          closeModalWindow();

        }
      );


      songsList.appendChild(
        item
      );

    }
  );

}


/* =========================
   BASIC HTML ESCAPE
========================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================
   SHUFFLE
========================= */

shuffleToggle.addEventListener(
  "click",
  () => {

    isShuffle =
      !isShuffle;

    shuffleStatus.textContent =
      isShuffle
        ? "On"
        : "Off";

  }
);


/* =========================
   REPEAT
========================= */

repeatToggle.addEventListener(
  "click",
  () => {

    repeatMode =
      repeatMode === 0
        ? 1
        : 0;

    repeatStatus.textContent =
      repeatMode === 1
        ? "Single loop"
        : "All songs";

  }
);


/* =========================
   BACKGROUNDS
========================= */

const backgrounds = [

  "https://raw.githubusercontent.com/suryansh6467/songs/main/172404-your_name-mitsuha_miyamizu-taki_tachibana-anime-atmosphere-7680x4320.jpg",

  "https://raw.githubusercontent.com/suryansh6467/songs/main/anime-girl-meteor-streak-10k-0t.jpg",

  "https://raw.githubusercontent.com/suryansh6467/songs/main/horizon-clouds-sea-sunset-calm-8k-3q.jpg"

];


function changeBackground(index) {

  if (
    index < 0 ||
    index >= backgrounds.length
  ) {
    return;
  }

  currentBgIndex =
    index;


  const image =
    new Image();


  image.onload =
    () => {

      if (activeLayer === 1) {

        bg2.src =
          backgrounds[index];

        bg2.classList.add(
          "active"
        );

        bg1.classList.remove(
          "active"
        );

        activeLayer = 2;

      } else {

        bg1.src =
          backgrounds[index];

        bg1.classList.add(
          "active"
        );

        bg2.classList.remove(
          "active"
        );

        activeLayer = 1;

      }


      document
        .querySelectorAll(".bg-thumb")
        .forEach(
          (thumb, thumbIndex) => {

            thumb.classList.toggle(
              "active",
              thumbIndex === index
            );

          }
        );

    };


  image.src =
    backgrounds[index];

}


/* =========================
   BACKGROUND THUMBNAILS
========================= */

document
  .querySelectorAll(".bg-thumb")
  .forEach(
    thumb => {

      thumb.addEventListener(
        "click",
        () => {

          changeBackground(
            Number(
              thumb.dataset.index
            )
          );

        }
      );

    }
  );


/* =========================
   AUTO BACKGROUND
========================= */

setInterval(
  () => {

    const next =
      (currentBgIndex + 1) %
      backgrounds.length;

    changeBackground(next);

  },
  30000
);


/* =========================
   INITIAL SONG
========================= */

loadSong(
  playlist[currentSongIndex]
);

</script>
